<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0A8878" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0C131A" media="(prefers-color-scheme: dark)"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/favicon.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TRINCADA">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="firebase-config.js"></script>
<title>TRINCADA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: trilho lateral no desktop, barra inferior no celular; cartões de uma coluna que viram duas no desktop.
   Cores do plano: laranja = carbo alto, azul = carbo baixo (mesma legenda da planilha). Verde-água = ação e progresso. */
:root{
  --bg:#EBEFF2; --surface:#FFFFFF; --surface2:#F4F7F9; --ink:#101A24; --ink2:#4A5866; --ink3:#76848F; --line:#D8DFE5;
  --brand:#0A8878; --brand-ink:#FFFFFF; --brand-soft:#DCF2EE;
  --hi:#D96A0C; --hi-soft:#FBE8D5; --lo:#2B6CC9; --lo-soft:#DCE8F8; --rest:#8A96A1; --rest-soft:#E6EAEE;
  --ok:#1B8F52; --ok-soft:#DDF3E6; --warn:#A57300; --warn-soft:#FFF1C2; --bad:#C93A3A; --bad-soft:#FBE0E0;
  --info-soft:#DCE8F8; --shadow:0 1px 2px rgba(16,26,36,.06),0 4px 14px rgba(16,26,36,.05);
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C131A; --surface:#151F29; --surface2:#1B2733; --ink:#E9EFF4; --ink2:#A9B6C2; --ink3:#7C8A97; --line:#2A3946;
  --brand:#33C4AE; --brand-ink:#06201C; --brand-soft:#12383A;
  --hi:#F3984A; --hi-soft:#3B2815; --lo:#6FA5F2; --lo-soft:#17294A; --rest:#8A98A5; --rest-soft:#222F3B;
  --ok:#4CCB87; --ok-soft:#133726; --warn:#E6B73C; --warn-soft:#3C3010; --bad:#F07474; --bad-soft:#40191B;
  --info-soft:#17294A; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C131A; --surface:#151F29; --surface2:#1B2733; --ink:#E9EFF4; --ink2:#A9B6C2; --ink3:#7C8A97; --line:#2A3946;
  --brand:#33C4AE; --brand-ink:#06201C; --brand-soft:#12383A;
  --hi:#F3984A; --hi-soft:#3B2815; --lo:#6FA5F2; --lo-soft:#17294A; --rest:#8A98A5; --rest-soft:#222F3B;
  --ok:#4CCB87; --ok-soft:#133726; --warn:#E6B73C; --warn-soft:#3C3010; --bad:#F07474; --bad-soft:#40191B;
  --info-soft:#17294A; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
html,body{overscroll-behavior-y:none}
input,select,textarea{font-size:16px!important}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:600;letter-spacing:.01em;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)} .faint{color:var(--ink3)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.upper{text-transform:uppercase;letter-spacing:.07em;font-size:11.5px;font-weight:600;color:var(--ink3)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* shell: layout de celular em qualquer tela (coluna única + barra de abas embaixo) */
.app{display:block;min-height:100vh}
.main{min-width:0;padding-block:12px calc(92px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));max-width:560px;width:100%;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px))}
.tabbar .tbi{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);max-width:560px;margin:0 auto}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;color:var(--ink3);font-size:11px;font-weight:600;border-radius:10px;min-width:0;min-height:52px}
.tabbar button svg{width:23px;height:23px}
.tabbar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabbar button[aria-current="page"]{color:var(--brand)}
.tabbar button[aria-current="page"] svg{stroke-width:2.3}

/* top */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 6px;font-weight:600}
.who .av{width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:15px;font-weight:700}
.datenav{display:flex;align-items:center;gap:4px;margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.datenav button{border:0;background:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.datenav button:hover{background:var(--surface2)}
.datenav .dl{padding:0 8px;font-weight:600;min-width:112px;text-align:center;font-size:14px;cursor:pointer;border:0;background:none;height:34px;width:auto;border-radius:999px}
.sync{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:5px}
#syncdot:not(.on):not(.err){display:none}
#syncdot{position:fixed;top:calc(env(safe-area-inset-top,0px) + 5px);right:8px;z-index:25;padding:3px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--rest);display:inline-block}
.sync.on i{background:var(--ok)} .sync.err i{background:var(--bad)}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card>h3,.card .ch{font-size:20px;margin-bottom:10px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card .ch h3{font-size:20px}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}

.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--rest-soft);color:var(--ink2);white-space:nowrap}
.pill.hi{background:var(--hi-soft);color:var(--hi)} .pill.lo{background:var(--lo-soft);color:var(--lo)} .pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.brand{background:var(--brand-soft);color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 15px;border-radius:11px;font-weight:600;font-size:15px;min-height:46px;line-height:1.1}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)} .btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:7px 12px;min-height:38px;font-size:14px;border-radius:9px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)} .btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn svg,.ico{width:18px;height:18px;flex:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--ink2);min-height:40px}
.seg button:hover,.chip:hover{background:var(--surface2)}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.seg button.s-skip[aria-pressed="true"]{background:var(--rest);border-color:var(--rest);color:#fff}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;flex:1 0 auto;padding:10px 12px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink2);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-height:46px;color:var(--ink);font-weight:500;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.bar{height:9px;border-radius:999px;background:var(--rest-soft);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .25s}
.bar.hi>i{background:var(--hi)} .bar.lo>i{background:var(--lo)} .bar.over>i{background:var(--warn)}
.kv{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.big{font-family:var(--f-display);font-weight:600;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:16px;font-weight:500;color:var(--ink3);margin-left:3px}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.tile{background:var(--surface2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .v{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;color:var(--ink3);font-weight:500}
.note{border-radius:10px;padding:10px 12px;font-size:13.5px;background:var(--info-soft)}
.note.warn{background:var(--warn-soft)} .note.ok{background:var(--ok-soft)} .note.bad{background:var(--bad-soft)}
.empty{text-align:center;color:var(--ink3);padding:22px 10px;border:1px dashed var(--line);border-radius:12px;font-size:14px}
.sep{height:1px;background:var(--line);margin:12px 0;border:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
table.tbl th{background:var(--surface2);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);padding:8px 10px;white-space:nowrap;position:sticky;top:0}
table.tbl td{padding:8px 10px;border-top:1px solid var(--line);white-space:nowrap}
table.tbl td.wrap{white-space:normal}
.pos{color:var(--ok)} .neg{color:var(--bad)}

/* hero */
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--rest)}
.hero.hi::before{background:var(--hi)} .hero.lo::before{background:var(--lo)}
.hero .dn{font-family:var(--f-display);font-size:64px;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums}
.hero .dt{display:flex;flex-direction:column;gap:2px}
.hero .dt b{font-size:18px}
.hero .pills{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
@media (max-width:560px){.hero .pills{margin-left:0;width:100%}}

/* meal */
.meal{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:9px;min-width:0}
.meal.st-plan,.meal.st-swap,.meal.st-custom{border-color:color-mix(in srgb,var(--brand) 55%,var(--line));background:color-mix(in srgb,var(--brand-soft) 35%,var(--surface))}
.meal.st-skip{opacity:.72}
.meal header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.meal .mt{font-family:var(--f-display);font-size:19px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums}
.meal h4{font-size:20px}
.meal .mk{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.meal ul{margin:0;padding-left:18px;color:var(--ink)} .meal li{margin:1px 0}
.meal li .alt{color:var(--ink3);font-size:12.5px}
.swapbox{background:var(--surface2);border-radius:9px;padding:9px 11px;font-size:13.5px}
.foodrow{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.foodrow .fn{min-width:0;overflow-wrap:anywhere}
.iconbtn{border:0;background:none;width:42px;height:42px;border-radius:8px;display:grid;place-items:center;color:var(--ink3)}
.iconbtn:hover{background:var(--surface2);color:var(--ink)} .iconbtn.del:hover{color:var(--bad)}

/* workout */
.ex{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface);min-width:0}
.ex.complete{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.ex header{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ex h4{font-size:20px}
.ex .pl{color:var(--ink2);font-size:13.5px}
.setrow{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 48px;gap:8px;align-items:center}
.setrow .sn{font-family:var(--f-display);font-size:18px;color:var(--ink3);text-align:center}
.setrow input{text-align:center;font-variant-numeric:tabular-nums}
.chk{width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);display:grid;place-items:center;color:transparent}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.ssb{background:var(--lo-soft);color:var(--lo);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;letter-spacing:.05em}


.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}

/* charts */
.chart{position:relative;width:100%;min-height:120px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--ink3);font-variant-numeric:tabular-nums}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 9px;font-size:12px;line-height:1.35;white-space:nowrap;z-index:5;transform:translate(-50%,-100%);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:6px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:14px;height:3px;border-radius:2px;display:inline-block}

/* modal + toast */
.ov{position:fixed;inset:0;z-index:60;background:rgba(8,14,20,.55);display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.modal.wide{max-width:760px}

.modal h3{font-size:24px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:-18px;background:var(--surface);padding-top:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
#toast div{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.3)}

.foodlist{display:flex;flex-direction:column;max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.foodlist button{border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:9px 11px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.foodlist button:first-child{border-top:0} .foodlist button:hover{background:var(--surface2)}
.photos{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.photo{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
.photo img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.photo .cap{padding:6px 8px;font-size:12px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
details.acc{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
details.acc>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:20px;font-weight:600}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg);transition:transform .15s}
details.acc[open]>summary::after{transform:rotate(-135deg)}
details.acc .accb{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.edrow{display:grid;grid-template-columns:minmax(0,2fr) 54px 74px minmax(0,1.3fr) 60px auto;gap:6px;align-items:center}
@media (max-width:640px){.edrow{grid-template-columns:minmax(0,1fr) 1fr 1fr;} .edrow .nm{grid-column:1/-1}}
.edrow input{padding:7px 8px;min-height:42px}
.tip[hidden],.ov[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* tela do amigo: somente leitura (só navegação fica ativa) */
.rocontent [data-a]{pointer-events:none}
.rocontent [data-a="sub"],.rocontent [data-a="goday"],.rocontent [data-a="godieta"],.rocontent [data-a="gotreino"],.rocontent [data-a="tab"],.rocontent [data-a="histf"]{pointer-events:auto}
.rocontent input,.rocontent select,.rocontent textarea{pointer-events:none}
.rocontent select[data-c="exsel"],.rocontent select[data-c="msel"]{pointer-events:auto}
.rocontent .chk,.rocontent .seg button[data-a],.rocontent .iconbtn{opacity:.55}
.who svg{width:16px;height:16px;opacity:.55;margin-left:2px}
.menu{display:grid;gap:6px}.menu .btn{justify-content:space-between;min-height:48px;font-size:15px}.menu .btn svg{width:18px;height:18px;opacity:.5}
.pbar{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}
.pbar .av{width:38px;height:38px;border-radius:50%;background:var(--lo);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:20px;font-weight:700;flex:none}
.codebox{font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;user-select:all}

function bindTip(el,sp){
  const svg=el.querySelector('svg');if(!svg||!sp._geo)return;
  const tipEl=document.createElement('div');tipEl.className='tip';tipEl.hidden=true;el.appendChild(tipEl);
  const mv=ev=>{
    const r=svg.getBoundingClientRect();const px=(ev.clientX-r.left)*(sp._geo.W/r.width);let html='',x=0;
    if(sp.type==='bar'){const i=clamp(Math.floor((px-sp._geo.m.l)/sp._geo.bw),0,sp.bars.length-1);const b=sp.bars[i];html=b.tip;x=sp._geo.m.l+i*sp._geo.bw+sp._geo.bw/2}
    else{const xv=sp._geo.x0+(px-sp._geo.m.l)/(sp._geo.W-sp._geo.m.l-sp._geo.m.r)*(sp._geo.x1-sp._geo.x0);
      const base=sp.series.find(s=>!s.nodots&&s.pts.length)||sp.series[0];if(!base)return;
      let best=base.pts[0];for(const p of base.pts)if(Math.abs(p.x-xv)<Math.abs(best.x-xv))best=p;
      html=`<b>${fmtD(addDays(sp.epoch,best.x))}</b><br>`+sp.series.filter(s=>!s.nodots).map(s=>{let q=s.pts[0];for(const p of s.pts)if(Math.abs(p.x-best.x)<Math.abs(q.x-best.x))q=p;return Math.abs(q.x-best.x)<=3?`${esc(s.name)}: ${(sp.yfmt||f1)(q.y)}`:''}).filter(Boolean).join('<br>');
      x=sp._geo.X(best.x);const c=svg.querySelector('.cur');if(c){c.setAttribute('x1',x);c.setAttribute('x2',x);c.setAttribute('opacity','.5')}}
    if(!html){tipEl.hidden=true;return}
    tipEl.innerHTML=html;tipEl.hidden=false;tipEl.style.left=clamp(x*(r.width/sp._geo.W),50,r.width-50)+'px';tipEl.style.top='8px';
  };
  svg.addEventListener('pointermove',mv);svg.addEventListener('pointerdown',mv);
  svg.addEventListener('pointerleave',()=>{tipEl.hidden=true;const c=svg.querySelector('.cur');if(c)c.setAttribute('opacity','0')});
}

function upsertBody(p,f){let b=p.body.find(x=>x.date===f.date);if(!b){b={id:uid(),date:f.date};p.body.push(b)}
  for(const k of ['weight','waist','hip','chest','arm','thigh','bf','note'])if(f[k]!==undefined&&f[k]!==null&&f[k]!=='')b[k]=f[k];
  /* primeiro peso de quem entrou sem informar: vira o peso inicial; devolve true para sugerir recalcular a dieta */
  let first=false;if(f.weight!=null&&p.startWeight==null){p.startWeight=f.weight;first=!!p.needWeight}if(f.weight!=null)p.needWeight=false;return first}
function weightChart(p,id,h){
  const w=weightsOf(p);const ser=[{name:'Peso',color:'var(--brand)',pts:w.map(b=>({x:diffDays(b.date,p.start),y:b.weight}))}];
  const x1=Math.max(diffDays(p.end,p.start),...ser[0].pts.map(q=>q.x),0);
  const band=hasBand(p)?{name:`Meta (${p.goalMin}–${p.goalMax} kg)`,hi:[0,x1].map(x=>({x,y:trajectory(p,addDays(p.start,x),p.goalMin)})),lo:[0,x1].map(x=>({x,y:trajectory(p,addDays(p.start,x),p.goalMax)}))}:null;
  return chartLine(id,{series:ser,band,epoch:p.start,x0:0,x1,h,legend:false,today:diffDays(todayStr(),p.start),label:'Peso ao longo do tempo',yfmt:v=>f1(v)});
}

function mealCard(p,d,m){

  if(st&&st.s==='custom'){
    const foods=st.foods||[];

    <div class="row" style="margin-top:8px"><button class="btn sm" data-a="pickfood" data-m="${m.id}">${ico('plus')}Alimento</button><span class="small muted">ou some valores já calculados:</span></div>
    <div class="fields" style="grid-template-columns:repeat(4,minmax(0,1fr));margin-top:6px">${[['mk','kcal'],['mp','P g'],['mc','C g'],['mf','G g']].map(([k,l])=>`<label class="f">${l}<input type="number" inputmode="decimal" min="0" data-i="mman" data-m="${m.id}" data-f="${k}" value="${st[k]||''}"></label>`).join('')}</div></div>`;
  }
  const stat=st&&st.s;
  return `<article class="meal st-${stat||'none'}" id="meal_${m.id}"><header><span class="mt">${m.time}</span><h4>${esc(m.name)}</h4><span class="mk num">${f0(stat&&stat!=='skip'?c.kcal:planK)} kcal · ${f0(stat&&stat!=='skip'?c.p:m.p)} g P${stat&&stat!=='skip'?' <span class="pill ok">registrado</span>':''}</span></header>
   <ul>${m.items.map(it=>itemLine(it,hi,hi)).join('')}</ul>${m.note?`<p class="small muted">${esc(m.note)}</p>`:''}
   <div class="seg" role="group" aria-label="Como foi esta refeição">
    <button aria-pressed="${stat==='plan'}" data-a="mstat" data-m="${m.id}" data-s="plan">Segui o plano</button>
    ${sw.map((x,i)=>`<button aria-pressed="${stat==='swap'&&st.i===i}" data-a="mstat" data-m="${m.id}" data-s="swap" data-sw="${i}">Troca ${i+1}</button>`).join('')}
    <button aria-pressed="${stat==='custom'}" data-a="mstat" data-m="${m.id}" data-s="custom">Outro</button>
    <button class="s-skip" aria-pressed="${stat==='skip'}" data-a="mstat" data-m="${m.id}" data-s="skip">Pulei</button>
    ${stat?`<button data-a="mclear" data-m="${m.id}" aria-label="Desmarcar e não registrar esta refeição">✕ Desmarcar</button>`:''}</div>
   ${body}
   ${(sw.length||m.prep)?`<details class="acc"><summary style="font-size:16px;padding:8px 12px">Trocas e preparo</summary><div class="accb">${sw.map((x,i)=>`<div class="small"><b>${i+1}.</b> ${esc(x.t)} — <span class="num">${f0(x.lo)}${x.lo!==x.hi?'/'+f0(x.hi):''} kcal · ${f0(x.p)} g P</span></div>`).join('')}${m.prep?`<div class="small muted">${esc(m.prep)}</div>`:''}</div></details>`:''}
  </article>`;
}
function mealSub(st){const t=foodTot(st.foods);const k=t.kcal+(st.mk||0),pr=t.p+(st.mp||0);return `${f0(k)} kcal · ${f0(pr)} g P`}
function vDDia(){

function vDSem(){

  const logged=rows.filter(r=>r.t.logged);

  const bars=rows.map(r=>({x:fmtD(r.d),y:r.t.kcal,t:r.tg.kcal,color:r.hi?'var(--hi)':'var(--lo)',tip:`<b>${WD[dow(r.d)]} ${fmtD(r.d)}</b><br>${f0(r.t.kcal)} de ${f0(r.tg.kcal)} kcal<br>P ${f0(r.t.p)} g`}));
  return `<div class="stack"><div class="card"><div class="ch"><h3>Últimos 14 dias</h3><span class="small muted">até ${fmtD(end)}</span></div>
   <div class="tiles" style="margin-bottom:12px"><div class="tile"><span class="upper">Média kcal</span><span class="v">${f0(avgK)}</span></div><div class="tile"><span class="upper">Média proteína</span><span class="v">${f0(avgP)}<small> g</small></span></div><div class="tile"><span class="upper">Trolou</span><span class="v">${rows.filter(r=>r.ok===false).length}<small> dias</small></span></div><div class="tile"><span class="upper">Dias na dieta</span><span class="v">${rows.filter(r=>r.ok===true).length}<small> / 14</small></span></div></div>
   ${chartBar('dsem',{bars,label:'Calorias por dia',legendHtml:`<div class="lg"><span><i style="background:var(--hi);height:9px"></i>Carbo alto</span><span><i style="background:var(--lo);height:9px"></i>Carbo baixo</span><span><i style="background:var(--ink);height:3px"></i>Meta do dia</span></div>`})}</div>
   <div class="card"><div class="ch"><h3>Dia a dia</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Dia</th><th>Tipo</th><th>kcal</th><th>Meta</th><th>P (g)</th><th>Dieta</th></tr></thead><tbody>
   ${rows.slice().reverse().map(r=>`<tr><td><button class="btn sm ghost" data-a="goday" data-d="${r.d}" data-t="dieta">${WD[dow(r.d)]} ${fmtD(r.d)}</button></td><td><span class="pill ${r.hi?'hi':'lo'}">${r.hi?'alto':'baixo'}</span></td><td>${r.t.logged?f0(r.t.kcal):'—'}</td><td>${f0(r.tg.kcal)}</td><td>${r.t.logged?f0(r.t.p):'—'}</td><td>${r.ok===true?'<span class="pos">✔</span>':r.ok===false?'<span class="neg">✘</span>':'—'}</td></tr>`).join('')}</tbody></table></div></div></div>`;
}

/* ========== TREINO ========== */
const TW={};            // treino escolhido por dia (antes de iniciar)
const mmss=s=>pad(Math.floor(s/60))+':'+pad(s%60);
let WL=null;
async function keepAwake(on){try{if(on&&!WL&&navigator.wakeLock&&document.visibilityState==='visible'){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}else if(!on&&WL){await WL.release();WL=null}}catch(e){WL=null}}
function wantAwake(){const s=sessionOf(P(),todayStr());return !!(s&&!s.finished)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake(wantAwake())});
setInterval(()=>{const e=$('#elapsed');if(!e)return;const s=sessionOf(P(),D());if(s&&s.startTs&&!s.finished)e.textContent=mmss(Math.floor((Date.now()-s.startTs)/1000)).replace(/^(\d\d):/,(m,a)=>a+':')},1000);

function vTreino(){
  const t=tabsHtml('treino',[['sessao','Sessão'],['plano','Plano'],['evolucao','Evolução']],'sessao');
  const s=sub('treino','sessao');return t+(s==='plano'?vTPlano():s==='evolucao'?vTEvo():vTSessao());
}
function exsFor(p,wid,d){const wk=p.plan.workouts[wid];if(!wk)return [];return wk.phases[phaseOf(wk,d)].ex}
function perfText(lp){if(!lp)return '';const ds=lp.ex.sets.filter(x=>x.done);const u=lp.ex.unit==='s'?' s':'';return `Último (${fmtD(lp.date)}): ${ds.map(x=>(num(x.kg)?f1(num(x.kg),num(x.kg)%1?1:0)+' kg × ':'')+(x.reps||'?')+u).join(' · ')}`}
function progHint(lp,e){if(!lp||!e.reps||e.unit==='s')return '';const top=topRep(e.reps);if(!top)return '';
  const ds=lp.ex.sets.filter(x=>x.done);if(ds.length&&ds.length>=e.sets&&ds.every(x=>num(x.reps)>=top))return `<span class="pill ok">Fechou todas as reps: suba o menor degrau</span>`;return ''}
function vTSessao(){
  const p=P(),d=D(),sch=schedOf(p,d);let s=sessionOf(p,d);const wids=Object.keys(p.plan.workouts);
  if(!wids.length)return `<div class="empty">Nenhum treino cadastrado. Crie em Plano.</div>`;
  const wid=s?s.wid:(TW[d]||(sch!=='R'&&p.plan.workouts[sch]?sch:wids[0]));
  const wk=p.plan.workouts[wid];const ph=wk?wk.phases[phaseOf(wk,d)]:null;
  const head=`<div class="card" style="margin-bottom:14px"><div class="row"><div class="sp"><span class="upper">${s?'Treino de '+WD[dow(d)]+' '+fmtD(d):sch==='R'?'Dia de descanso no plano':'Treino do dia'}</span>
    <h3 style="font-size:26px">${s||sch!=='R'?`${wid} — ${esc(wk?wk.name:'')}`:'Escolha um treino extra'}</h3><div class="small muted">${wk?esc(wk.dur||''):''}${ph&&ph.label?' · '+esc(ph.label):''}</div></div>
    ${s?`<span class="pill ${s.finished?'ok':'warn'}">${s.finished?'Concluído':'Em andamento'}</span>`:gaved(p,d)?'<span class="pill bad">Givei</span>':''}</div>
    ${!s?`<div class="row" style="margin-top:10px"><label class="f" style="flex-direction:row;align-items:center;gap:8px">Treino<select id="wsel" data-c="wsel" style="width:auto">${wids.map(k=>`<option value="${k}" ${k===wid?'selected':''}>${k} — ${esc(p.plan.workouts[k].name)}</option>`).join('')}</select></label></div>`:''}
    ${wk&&wk.note?`<p class="small muted" style="margin-top:8px">${esc(wk.note)}</p>`:''}
    ${sch!=='R'&&!(s&&sessDone(s))?`<div class="row" style="margin-top:10px">${givaBtn(p,d)}<span class="small muted sp" style="min-width:160px">${gaved(p,d)?'Registrado: o treino foi givado neste dia.':'Não vai treinar direito hoje? Registre aqui.'}</span></div>`:''}</div>`;
  if(!wk)return head;
  if(!s){
    const exs=exsFor(p,wid,d);
    return head+`<div class="stack">${exs.map(e=>{const lp=lastPerf(p,e.name);return `<div class="ex"><header><h4>${e.ss?`<span class="ssb">SUPERSET ${e.ss}</span> `:''}${esc(e.name)}</h4><span class="pl num">${e.sets} × ${esc(e.reps)} · ${esc(e.load)}</span></header>${lp?`<div class="small muted">${perfText(lp)}</div>`:''}</div>`}).join('')}
    <div class="row"><button class="btn pri" data-a="startsess" data-w="${wid}">${ico('timer')}Iniciar treino</button><span class="small muted">${exs.length} exercícios · aquecimento: 5–8 min leve + 1–2 séries leves do 1º exercício</span></div></div>`;
  }
  const vol=setsVol(s),sd=setsDone(s);
  return head+`<div class="tiles" style="margin-bottom:14px"><div class="tile"><span class="upper">Tempo</span><span class="v" id="elapsed">${s.finished?(s.dur!=null?s.dur+'':'—'):mmss(Math.floor((Date.now()-(s.startTs||Date.now()))/1000))}</span>${s.finished?'<span class="small muted">minutos</span>':''}</div>
   <div class="tile"><span class="upper">Séries feitas</span><span class="v" id="sdone">${sd}<small> / ${s.exercises.reduce((a,e)=>a+e.sets.length,0)}</small></span></div>
   <div class="tile"><span class="upper">Volume</span><span class="v" id="svol">${f0(vol)}<small> kg</small></span></div></div>
  <div class="stack">${s.exercises.map((e,i)=>exCard(p,s,e,i)).join('')}
   <div class="row"><button class="btn" data-a="addex">${ico('plus')}Exercício extra</button></div>
   <div class="card"><label class="f">Anotações do treino<textarea id="snote" data-i="snote" placeholder="Como foi a energia, cargas que subiram, o que mudar na próxima…">${esc(s.notes||'')}</textarea></label>
    <div class="row" style="margin-top:12px">${s.finished?`<label class="f" style="flex-direction:row;align-items:center;gap:8px">Duração (min)<input type="number" inputmode="numeric" data-i="sdur" value="${s.dur??''}" style="width:90px"></label><button class="btn" data-a="reopen">Reabrir</button>`
      :`<button class="btn pri" data-a="finish">${ico('check')}Finalizar treino</button>`}<span class="sp"></span><button class="btn danger sm" data-a="delsess">${ico('trash')}Excluir sessão</button></div></div></div>`;
}
I.wsel=el=>{TW[D()]=el.value;render()};
function exCard(p,s,e,i){
  const lp=lastPerf(p,e.name,s.date);const all=e.sets.length&&e.sets.every(x=>x.done);const u=e.unit==='s';
  const top=topRep(e.reps);
  return `<div class="ex ${all?'complete':''}" id="ex_${i}"><header><h4>${e.ss?`<span class="ssb">SS ${e.ss}</span> `:''}${esc(e.name)}</h4><span class="pl num">${esc(e.plan)} · ${esc(e.load)}</span></header>
   ${lp?`<div class="small muted">${perfText(lp)}</div>`:''}${lp?progHint(lp,{reps:e.reps,sets:e.plan?parseInt(e.plan):e.sets.length,unit:e.unit}):''}
   <div class="setrow upper" style="font-size:10.5px"><span></span><span style="text-align:center">${u?'—':'kg'}</span><span style="text-align:center">${u?'segundos':'reps'}</span><span></span></div>
   ${e.sets.map((x,k)=>`<div class="setrow"><span class="sn">${k+1}</span><input type="number" inputmode="decimal" step="0.5" min="0" value="${x.kg}" placeholder="${u?'—':'kg'}" data-i="setkg" data-e="${i}" data-k="${k}" ${u?'disabled':''} aria-label="Carga série ${k+1}">
    <input type="number" inputmode="numeric" min="0" value="${x.reps}" placeholder="${top||''}" data-i="setreps" data-e="${i}" data-k="${k}" aria-label="Repetições série ${k+1}"><button class="chk" aria-pressed="${x.done}" data-a="setdone" data-e="${i}" data-k="${k}" aria-label="Série ${k+1} feita">${ico('check')}</button></div>`).join('')}
   <div class="row"><button class="btn sm" data-a="addset" data-e="${i}">${ico('plus')}Série</button><button class="btn sm ghost" data-a="rmset" data-e="${i}">${ico('minus')}Série</button><span class="sp"></span><button class="iconbtn del" data-a="rmex" data-e="${i}" aria-label="Remover exercício">${ico('trash')}</button></div></div>`;
}
function newSession(p,d,wid){
  const wk=p.plan.workouts[wid],ph=phaseOf(wk,d);const exs=exsFor(p,wid,d);
  return {id:uid(),date:d,wid,ph,startTs:Date.now(),finished:false,notes:'',dur:null,
    exercises:exs.map(e=>{const lp=lastPerf(p,e.name,d);const dk=lp?lp.ex.sets.filter(x=>x.done&&num(x.kg)!=null).map(x=>num(x.kg)):[];const kg=dk.length?Math.max(...dk):(e.kg===''?'':e.kg);
      return {name:e.name,plan:`${e.sets} × ${e.reps}`,load:e.load,reps:e.reps,unit:e.unit||'',ss:e.ss||'',sets:Array.from({length:e.sets},()=>({kg:e.unit==='s'?'':kg,reps:'',done:false}))}})};
}
A.startsess=el=>{const p=P(),d=D();p.sessions.push(newSession(p,d,el.dataset.w));if(p.days[d])p.days[d].giva=false;save();render()};
function curSess(){return sessionOf(P(),D())}
function patchSess(){const s=curSess();if(!s)return;const a=$('#sdone');if(a)a.innerHTML=`${setsDone(s)}<small> / ${s.exercises.reduce((x,e)=>x+e.sets.length,0)}</small>`;const v=$('#svol');if(v)v.innerHTML=`${f0(setsVol(s))}<small> kg</small>`}
I.setkg=el=>{const s=curSess();s.exercises[+el.dataset.e].sets[+el.dataset.k].kg=el.value;save();patchSess()};
I.setreps=el=>{const s=curSess();s.exercises[+el.dataset.e].sets[+el.dataset.k].reps=el.value;save();patchSess()};
A.setdone=el=>{const s=curSess(),e=s.exercises[+el.dataset.e],x=e.sets[+el.dataset.k];x.done=!x.done;
  if(x.done){if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}if(!x.reps&&e.unit!=='s'){const t=topRep(e.reps);if(t)x.reps=String(t)}
}
  save();render()};
A.addset=el=>{const e=curSess().exercises[+el.dataset.e];const l=e.sets[e.sets.length-1];e.sets.push({kg:l?l.kg:'',reps:'',done:false});save();render()};
A.rmset=el=>{const e=curSess().exercises[+el.dataset.e];if(e.sets.length>1){e.sets.pop();save();render()}};
A.rmex=el=>{const s=curSess();const e=s.exercises[+el.dataset.e];ask(`Remover “${e.name}” desta sessão?`,()=>{s.exercises.splice(+el.dataset.e,1);save();render()},'Remover')};
A.addex=()=>{
  const p=P();const names=[...new Set(Object.values(p.plan.workouts).flatMap(w=>w.phases.flatMap(f=>f.ex.map(e=>e.name))))].sort();
  openModal(`<h3>Exercício extra</h3><label class="f">Nome<input type="text" id="ax_n" list="axl" placeholder="Digite ou escolha"><datalist id="axl">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></label>
  <div class="fields"><label class="f">Séries<input type="number" id="ax_s" value="3"></label><label class="f">Repetições<input type="text" id="ax_r" value="10"></label><label class="f">Carga (kg)<input type="number" id="ax_k" step="0.5"></label></div>
  <div class="mfoot"><button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="addexok">Adicionar</button></div>`)};
A.addexok=()=>{const n=$('#ax_n').value.trim();if(!n){toast('Informe o nome');return}const sets=clamp(parseInt($('#ax_s').value)||3,1,12),kg=$('#ax_k').value;const s=curSess();
  s.exercises.push({name:n,plan:`${sets} × ${$('#ax_r').value||'10'}`,load:kg?kg+' kg':'—',reps:$('#ax_r').value||'10',unit:'',ss:'',sets:Array.from({length:sets},()=>({kg,reps:'',done:false}))});save();closeModal();render()};
I.snote=el=>{curSess().notes=el.value;save()};
I.sdur=el=>{curSess().dur=num(el.value);save()};
A.finish=()=>{const p=P(),s=curSess();if(!setsDone(s)){toast('Marque pelo menos uma série como feita');return}
  const prs=[];for(const e of s.exercises){const dk=e.sets.filter(x=>x.done&&num(x.kg)>0&&e.unit!=='s').map(x=>num(x.kg));if(!dk.length)continue;const mx=Math.max(...dk);
    const prev=exHistory(p,e.name).filter(h=>h.date<s.date);if(prev.length&&mx>Math.max(...prev.map(h=>h.kg)))prs.push(`${e.name}: ${f1(mx,mx%1?1:0)} kg`)}
  s.finished=true;s.dur=s.startTs?Math.max(1,Math.round((Date.now()-s.startTs)/60000)):s.dur;s.vol=Math.round(setsVol(s));s.setsDone=setsDone(s);stopRest();save();render();
  openModal(`<h3>Treino concluído</h3><div class="tiles"><div class="tile"><span class="upper">Duração</span><span class="v">${s.dur??'—'}<small> min</small></span></div><div class="tile"><span class="upper">Séries</span><span class="v">${s.setsDone}</span></div><div class="tile"><span class="upper">Volume</span><span class="v">${f0(s.vol)}<small> kg</small></span></div></div>
  ${prs.length?`<div class="note ok"><b>Recorde de carga</b><br>${prs.map(esc).join('<br>')}</div>`:'<p class="muted small">Mantenha as cargas: em déficit calórico, manter já é o objetivo.</p>'}
  ${s.dur&&s.dur<60?'<p class="small muted">Treino abaixo de 1 hora: o plano sugere +1 série nos principais se sobrar tempo.</p>':''}
  <div class="mfoot"><button class="btn pri" data-a="close">Fechar</button></div>`)};
A.reopen=()=>{const s=curSess();s.finished=false;s.startTs=s.startTs||Date.now()-(s.dur||0)*60000;save();render()};
A.delsess=()=>ask('Excluir esta sessão de treino e todas as séries registradas?',()=>{const p=P();p.sessions=p.sessions.filter(x=>x.date!==D());stopRest();save();render()},'Excluir');

function vTEvo(){
  const p=P(),S2=p.sessions.filter(sessDone).sort((a,b)=>a.date.localeCompare(b.date));
  const names=[...new Set(S2.flatMap(s=>s.exercises.filter(e=>e.sets.some(x=>x.done)).map(e=>e.name)))];
  const sel=S.ui.exsel&&names.includes(S.ui.exsel)?S.ui.exsel:names[0];
  const totV=S2.reduce((a,s)=>a+setsVol(s),0),totS=S2.reduce((a,s)=>a+setsDone(s),0);
  /* sessões por semana (últimas 8, semanas começando no domingo) */
  const wk0=addDays(D(),-dow(D()));const bars=[];for(let i=7;i>=0;i--){const a=addDays(wk0,-7*i),b=addDays(a,6);const n=S2.filter(s=>s.date>=a&&s.date<=b).length;bars.push({x:fmtD(a),y:n,t:5,color:'var(--brand)',tip:`<b>Semana de ${fmtD(a)}</b><br>${n} treino${n===1?'':'s'}`})}
  let exblock='<div class="empty">Registre treinos para ver a evolução de cada exercício.</div>';
  if(sel){const h=exHistory(p,sel);const u=h[0]&&h[0].unit==='s';
    const ser=[{name:u?'Melhor série (s)':'Maior carga (kg)',color:'var(--brand)',pts:h.map(q=>({x:diffDays(q.date,PLAN_START),y:u?q.reps:q.kg}))}];
    if(!u)ser.push({name:'1RM estimado (kg)',color:'var(--hi)',dash:true,pts:h.map(q=>({x:diffDays(q.date,PLAN_START),y:q.e1})),endLabel:false});
    exblock=`<div class="row" style="margin-bottom:10px"><label class="f" style="flex:1;min-width:200px">Exercício<select data-c="exsel">${names.map(n=>`<option ${n===sel?'selected':''}>${esc(n)}</option>`).join('')}</select></label></div>
     ${h.length>1?chartLine('exev',{series:ser,epoch:PLAN_START,x0:Math.min(...ser[0].pts.map(q=>q.x))-1,x1:Math.max(...ser[0].pts.map(q=>q.x))+1,label:'Evolução do exercício',yfmt:v=>f1(v,v%1?1:0)}):`<div class="note">Precisa de pelo menos duas sessões com este exercício para desenhar a curva.</div>`}
     <div class="tbl-wrap" style="margin-top:10px"><table class="tbl"><thead><tr><th>Data</th><th>Melhor série</th><th>Séries</th><th>Volume</th></tr></thead><tbody>${h.slice().reverse().map(q=>`<tr><td>${fmtDY(q.date)}</td><td>${q.unit==='s'?q.reps+' s':f1(q.kg,q.kg%1?1:0)+' kg × '+q.reps}</td><td>${q.sets}</td><td>${f0(q.vol)} kg</td></tr>`).join('')}</tbody></table></div>`}
  return `<div class="stack"><div class="tiles"><div class="tile"><span class="upper">Treinos feitos</span><span class="v">${S2.length}</span></div><div class="tile"><span class="upper">Séries</span><span class="v">${f0(totS)}</span></div><div class="tile"><span class="upper">Volume total</span><span class="v">${f0(totV/1000)}<small> t</small></span></div></div>
   <div class="card"><div class="ch"><h3>Treinos por semana</h3></div>${chartBar('twk',{bars,h:170,yfmt:f0,label:'Treinos por semana',legendHtml:'<div class="lg"><span><i style="background:var(--ink);height:3px"></i>Meta do plano: 5 por semana</span></div>'})}</div>
   <div class="card"><div class="ch"><h3>Por exercício</h3></div>${exblock}</div>
   <div class="card"><div class="ch"><h3>Sessões</h3></div>${S2.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Data</th><th>Treino</th><th>Séries</th><th>Volume</th><th>Min</th></tr></thead><tbody>${S2.slice().reverse().map(s=>`<tr><td><button class="btn sm ghost" data-a="goday" data-d="${s.date}" data-t="treino">${WD[dow(s.date)]} ${fmtD(s.date)}</button></td><td>${s.wid} — ${esc((p.plan.workouts[s.wid]||{}).name||'')}</td><td>${setsDone(s)}</td><td>${f0(setsVol(s))} kg</td><td>${s.dur??'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma sessão registrada ainda.</div>'}</div></div>`;
}

const MEAS=[['waist','Cintura','cm'],['hip','Quadril','cm'],['chest','Peito','cm'],['arm','Braço D','cm'],['thigh','Coxa D','cm'],['bf','Gordura','%']];
function vCorpo(){const t=tabsHtml('corpo',[['medidas','Medidas'],['fotos','Fotos']],'medidas');return t+(sub('corpo','medidas')==='fotos'?vFotos():vMedidas())}
function vMedidas(){
  const p=P(),bs=bodyStats(p),B=bodySorted(p);const ms=S.ui.msel||'waist';const mm=MEAS.find(m=>m[0]===ms)||MEAS[0];
  const sundays=[];for(let d=p.start,n=0;d<=p.end;d=addDays(d,7),n++)sundays.push({n,d});
  const wser=B.filter(b=>b[mm[0]]!=null).map(b=>({x:diffDays(b.date,p.start),y:b[mm[0]]}));
  /* tendência: média móvel de 7 dias do peso */
  const W=weightsOf(p);const trend=W.map(b=>{const near=W.filter(q=>Math.abs(diffDays(q.date,b.date))<=3);return {x:diffDays(b.date,p.start),y:near.reduce((a,q)=>a+q.weight,0)/near.length}});
  const x1=Math.max(diffDays(p.end,p.start),...W.map(b=>diffDays(b.date,p.start)),1);
  const band=hasBand(p)?{name:`Meta de perda (${p.goalMin}–${p.goalMax} kg)`,hi:[0,x1].map(x=>({x,y:trajectory(p,addDays(p.start,x),p.goalMin)})),lo:[0,x1].map(x=>({x,y:trajectory(p,addDays(p.start,x),p.goalMax)}))}:null;
  return `<div class="stack">
  <div class="tiles"><div class="tile"><span class="upper">Peso atual</span><span class="v">${bs.last?f1(bs.last.weight):'—'}<small> kg</small></span><span class="small muted">${bs.last?fmtD(bs.last.date):''}</span></div>
   <div class="tile"><span class="upper">Perdido</span><span class="v ${bs.lost>0?'pos':bs.lost<0?'neg':''}">${bs.lost!=null?f1(bs.lost):'—'}<small> kg</small></span><span class="small muted">${bs.pct!=null&&p.goalMin>0?f0(bs.pct*100)+'% da meta mínima ('+p.goalMin+' kg)':''}</span></div>
   <div class="tile"><span class="upper">Cintura</span><span class="v">${bs.waistLast!=null?f1(bs.waistLast):'—'}<small> cm</small></span><span class="small muted">${bs.waistLost!=null?(bs.waistLost>=0?'−':'+')+f1(Math.abs(bs.waistLost))+' cm no total':'registre 2 medidas'}</span></div>
   <div class="tile"><span class="upper">Ritmo</span><span class="v">${bs.rate!=null?f1(bs.rate,2):'—'}<small> kg/sem</small></span><span class="small muted">IMC ${bs.bmi?f1(bs.bmi):'—'}${bs.lean?' · massa magra ≈ '+f1(bs.lean)+' kg':''}</span></div></div>
  ${bs.alert?`<div class="note ${bs.alert.c}"><b>${bs.alert.t}</b> ${bs.n<3?'Poucos registros: a leitura melhora com mais semanas.':''}</div>`:''}
  ${p.plan.creatine.off?'':`<div class="note"><b>Atenção à balança:</b> nas 2 primeiras semanas de creatina (a partir de ${fmtD(p.plan.creatine.start)}) o corpo retém 1 a 2 kg de água. Olhe a cintura e a tendência de 2–3 semanas.</div>`}
  <div class="card"><div class="ch"><h3>Peso</h3><button class="btn pri sm" data-a="bodyform" data-d="${D()}">${ico('plus')}Registrar</button></div>
   ${chartLine('cw',{series:[{name:'Peso',color:'var(--brand)',pts:W.map(b=>({x:diffDays(b.date,p.start),y:b.weight}))},{name:'Tendência (±3 dias)',color:'var(--ink3)',dash:true,w:2,nodots:true,pts:trend}],band,epoch:p.start,x0:0,x1,label:'Peso ao longo do plano',today:diffDays(todayStr(),p.start)})}</div>
  <div class="card"><div class="ch"><h3>${mm[1]}</h3><select data-c="msel" style="width:auto">${MEAS.map(m=>`<option value="${m[0]}" ${m[0]===ms?'selected':''}>${m[1]}</option>`).join('')}</select></div>
   ${wser.length?chartLine('cm',{series:[{name:mm[1]+' ('+mm[2]+')',color:'var(--lo)',pts:wser}],epoch:p.start,x0:0,x1,label:mm[1],legend:false,today:diffDays(todayStr(),p.start)}):`<div class="empty">Sem registros de ${mm[1].toLowerCase()}. Meça todo domingo e registre.</div>`}</div>
  <div class="card"><div class="ch"><h3>Pesagens de domingo</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nº</th><th>Data</th><th>Peso</th><th>Δ semana</th><th>Δ total</th><th>Cintura</th><th>Meta mín.</th><th>Meta máx.</th><th></th></tr></thead><tbody>
   ${sundays.map(s=>{const b=p.body.find(x=>x.date===s.d);const prev=sundays[s.n-1]?p.body.find(x=>x.date===sundays[s.n-1].d):null;const first=p.body.find(x=>x.date===p.start);
     return `<tr><td>${s.n}</td><td>${WD[dow(s.d)]} ${fmtD(s.d)}</td><td>${b&&b.weight!=null?'<b>'+f1(b.weight)+'</b>':'—'}</td><td>${b&&prev&&b.weight!=null&&prev.weight!=null?`<span class="${b.weight-prev.weight<=0?'pos':'neg'}">${sgn(b.weight-prev.weight)}</span>`:'—'}</td><td>${b&&first&&b.weight!=null&&first.weight!=null?sgn(b.weight-first.weight):'—'}</td><td>${b&&b.waist!=null?f1(b.waist):'—'}</td><td class="faint">${f1(trajectory(p,s.d,p.goalMin))}</td><td class="faint">${f1(trajectory(p,s.d,p.goalMax))}</td><td><button class="btn sm ${b?'ghost':''}" data-a="bodyform" data-d="${s.d}">${b?'Editar':'Registrar'}</button></td></tr>`}).join('')}</tbody></table></div></div>
  <div class="card"><div class="ch"><h3>Todos os registros</h3></div>${B.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Data</th><th>Peso</th>${MEAS.map(m=>`<th>${m[1]}</th>`).join('')}<th></th></tr></thead><tbody>${B.slice().reverse().map(b=>`<tr><td>${fmtDY(b.date)}</td><td>${b.weight!=null?f1(b.weight):'—'}</td>${MEAS.map(m=>`<td>${b[m[0]]!=null?f1(b[m[0]]):'—'}</td>`).join('')}<td><div class="row" style="gap:0;flex-wrap:nowrap"><button class="iconbtn" data-a="bodyform" data-d="${b.date}" aria-label="Editar">${ico('edit')}</button><button class="iconbtn del" data-a="bodydel" data-id="${b.id}" aria-label="Excluir">${ico('trash')}</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum registro.</div>'}
   <div class="note" style="margin-top:12px"><b>Como medir.</b> Cintura: fita na altura do umbigo, em pé, relaxado, depois de soltar o ar. Quadril: parte mais larga do bumbum. Peito: altura dos mamilos, braços soltos. Braço D e coxa D: ponto médio, relaxado. Use sempre a mesma fita, o mesmo lado e a mesma altura. Anote a cintura mesmo que o peso não mexa.</div></div></div>`;
}

A.bodyform=el=>{const p=P(),d=el.dataset.d||D();const b=p.body.find(x=>x.date===d)||{};

A.bodyok=()=>{const p=P(),d=$('#bf_d').value;if(!d){toast('Escolha a data');return}const f={date:d,note:$('#bf_note').value.trim()};
  for(const k of ['weight',...MEAS.map(m=>m[0])]){const v=num($('#bf_'+k).value);if(v!=null)f[k]=v}
  if(f.weight!=null&&(f.weight<20||f.weight>400)){toast('Peso fora do esperado');return}
  if(Object.keys(f).length<=2&&!f.note){toast('Preencha ao menos um valor');return}
  const need=upsertBody(p,f);save();closeModal();render();toast('Registro salvo');if(need)setTimeout(askRecalc,350)};
A.bodydel=el=>ask('Excluir este registro de medidas?',()=>{const p=P();p.body=p.body.filter(b=>b.id!==el.dataset.id);save();render()},'Excluir');

/* ========== amigos: quem usa o app aparece sozinho (somente leitura, ao vivo) ==========
   Cada pessoa continua gravando só na própria conta (users/<uid>/parts). Ao entrar, o app anota o nome da pessoa
   em directory/<uid>; todo mundo logado lê o directory, descobre os outros e acompanha users/<uid>/parts deles.
   Não existe código para trocar: entrou no app com conta, entrou no grupo. */
const FR={map:{},unsubDir:null,err:'',pub:''};
const frKey=u=>'diariofit.amigo.'+u, FRL='diariofit.amigos.v2';
const CL=['var(--brand)','var(--lo)','var(--hi)','var(--ok)','var(--bad)'];
const myUid=()=>(FB.user&&FB.user.uid)||null;
function firstName(n){return String(n||'').trim().split(/\s+/)[0].slice(0,8)||'Amigo'}
function relT(ts){
  if(!ts)return 'sem registros';const m=Math.round((Date.now()-ts)/60000);
  if(m<1)return 'agora';if(m<60)return `há ${m} min`;const h=Math.round(m/60);if(h<24)return `há ${h} h`;const d=Math.round(h/24);return `há ${d} dia${d>1?'s':''}`;
}
const friendList=()=>Object.values(FR.map).sort((a,b)=>String(a.name).localeCompare(String(b.name),'pt-BR'));
function friendSel(){const L=friendList();if(!L.length)return null;const k=S.ui.pf;if(k==='all'&&L.length>1)return 'all';if(k&&FR.map[k])return k;return L.length>1?'all':L[0].uid}
function friendCur(){const k=friendSel();return k&&k!=='all'?FR.map[k]:null}
function friendsTab(){
  if(!cfgOk())return null;const L=friendList();
  return ['par',L.length===1?firstName(L[0].name):'Amigos','users'];
}
function rebuildFriend(f){
  try{
    const st=fromParts(f.parts);if(!st){f.st=f.p=null;return}
    migrate(st);f.st=st;f.p=st.profiles[st.active]||Object.values(st.profiles)[0]||null;f.at=st.updatedAt||0;
    if(f.p&&f.p.name)f.name=f.p.name;

}
function frSaveList(){try{localStorage.setItem(FRL,JSON.stringify(friendList().map(f=>({uid:f.uid,name:f.name}))))}catch(e){}}
const frNew=(uid,name)=>({uid,name:name||'',parts:{},st:null,p:null,at:0,unsub:null,err:''});
function friendsLoadCache(){
  try{
    for(const x of JSON.parse(localStorage.getItem(FRL)||'[]')){
      const f=FR.map[x.uid]=frNew(x.uid,x.name);
      const raw=localStorage.getItem(frKey(x.uid));if(raw){f.parts=JSON.parse(raw);rebuildFriend(f)}
    }
  }catch(e){}
}
function stopFriends(){
  if(FR.unsubDir){try{FR.unsubDir()}catch(e){}FR.unsubDir=null}

let paintT=null;

  clearTimeout(paintT);

    const ae=document.activeElement,typing=!!(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName));

function publishMe(){
  if(!cfgOk()||!FB.ready||!FB.user)return;
  const nm=(S.profiles[S.active]||{}).name||'',key=FB.user.uid+'|'+nm;if(FR.pub===key)return;FR.pub=key;
  FB.fs.collection('directory').doc(FB.user.uid).set({n:nm,t:Date.now()}).catch(()=>{FR.pub=''});
}
function friendsRefresh(){
  if(!cfgOk()||!FB.ready)return;
  if(!FB.user){stopFriends();FR.pub='';paint();return}
  publishMe();
  if(!FR.unsubDir)watchDir();
  paint();
}
function watchDir(){
  FR.err='';
  try{
    FR.unsubDir=FB.fs.collection('directory').onSnapshot(snap=>{
      FR.err='';const seen={};
      snap.docs.forEach(d=>{
        const id=d.id;if(id===myUid())return;const v=d.data()||{};seen[id]=1;
        const f=FR.map[id]||(FR.map[id]=frNew(id,v.n));
        if(v.n&&!f.p)f.name=v.n;
        if(!f.unsub)watchFriend(f);
      });
      for(const id of Object.keys(FR.map))if(!seen[id]){const f=FR.map[id];if(f.unsub){try{f.unsub()}catch(e){}}delete FR.map[id];try{localStorage.removeItem(frKey(id))}catch(e){}}
      frSaveList();paint();
    },err=>{
      FR.unsubDir=null;FR.err=(err&&err.code)==='permission-denied'?'denied':'net';paint();
      setTimeout(()=>{if(FB.user&&!FR.unsubDir)watchDir()},FR.err==='denied'?15000:30000);
    });
  }catch(e){FR.err='net'}
}
function watchFriend(f){
  f.err='';
  try{
    f.unsub=FB.fs.collection('users').doc(f.uid).collection('parts').onSnapshot(snap=>{
      const parts={};snap.docs.forEach(d=>{const v=d.data();if(v&&typeof v.j==='string')parts[d.id]=v.j});
      if(parts.meta){f.err='';f.parts=parts;try{localStorage.setItem(frKey(f.uid),JSON.stringify(parts))}catch(e){}rebuildFriend(f);frSaveList()}
      else if(!f.p)f.err='empty';
      paint();
    },err=>{
      f.err=(err&&err.code)==='permission-denied'?'denied':'net';f.unsub=null;paint();
      setTimeout(()=>{if(FR.map[f.uid]===f&&!f.unsub&&FB.user)watchFriend(f)},f.err==='denied'?15000:30000);
    });
  }catch(e){f.err='net'}
}

/* ----- números para os comparativos ----- */
function pStats(p){
  const d=todayStr(),w=schedOf(p,d),wk=p.plan.workouts[w],sess=sessionOf(p,d),tt=dayTotals(p,d),tg=dayTarget(p,d),dl=getDay(p,d),doses=creDoses(p,d),ent=p.body.find(b=>b.date===d&&b.weight!=null);
  let tN=0,tD=0,dN=0,dD=0,cN=0,cD=0,wN=0,trN=0,gvN=0;
  for(let i=0;i<7;i++){const x=addDays(d,-i);if(x<p.start||x>p.end)continue;
    const tk=trainOK(p,x);if(schedOf(p,x)!=='R'&&(x<d||tk===true)){tD++;if(tk===true)tN++}
    const dk=dietOK(p,x);if(x<d||dk===true){dD++;if(dk===true)dN++}
    if(trolled(p,x))trN++;if(gaved(p,x)&&tk!==true)gvN++;
    const ck=creOK(p,x);if(ck!==null&&(x<d||ck===true)){cD++;if(ck===true)cN++}
    if(p.body.some(b=>b.date===x&&b.weight!=null))wN++}
  let streak=0;for(let x=d;x>=p.start;x=addDays(x,-1)){if(x>p.end)continue;const tk=trainOK(p,x);if(tk===true)streak++;else if(tk===null)continue;else if(x===d)continue;else break}
  const done=p.sessions.filter(sessDone);
  return {d,w,wk,sess,tt,tg,dl,doses,ent,tN,tD,dN,dD,cN,cD,wN,trN,gvN,streak,sessN:done.length,vol:done.reduce((a,s)=>a+setsVol(s),0),bs:bodyStats(p),
    rd:{page:rdPage(p),total:rdTotal(p),today:rdReadOn(p,d),gap:rdGap(p,d),week:rdWeek(p),rev:rdRevOn(p,d),isRev:!!(rdRow(d)&&rdRow(d).rev)},
    trained:!!(sess&&sessDone(sess)),gived:gaved(p,d)&&!(sess&&sessDone(sess)),trolled:trolled(p,d),creTaken:doses.filter((_,i)=>dl.cre[i]).length};
}
const wa=(l,t)=>`<a class="btn" href="https://wa.me/?text=${encodeURIComponent(t)}" target="_blank" rel="noopener">${esc(l)}</a>`;
/* tabela e gráfico: você + 1 amigo (Resumo dele) ou você + todos (Grupo) */
function vCompare(me,others,group){
  const all=[{p:me,nm:'Você',c:CL[0]}].concat(others.map((o,i)=>({p:o.p,nm:firstName(o.name||o.p.name),c:CL[(i+1)%CL.length],uid:o.uid})));
  const ST=all.map(x=>pStats(x.p)),N=all.length;
  const tp=s=>s.trained?'<span class="pill ok">Feito</span>':s.gived?'<span class="pill bad">Givou</span>':s.w==='R'?'<span class="pill">Descanso</span>':'<span class="pill warn">Pendente</span>';
  const tw=s=>s.w==='R'?'':`<div class="tiny faint">${s.w} · ${esc(s.wk?s.wk.name:'')}</div>`;
  const row=(l,fn)=>`<div class="lb">${l}</div>`+ST.map(s=>`<div>${fn(s)}</div>`).join('');
  const table=rows=>`<div class="cmpg${N>2?' c3':''}" style="grid-template-columns:minmax(0,1.25fr) repeat(${N},minmax(0,1fr))"><div class="h lb"></div>${all.map(x=>`<div class="h">${esc(x.nm)}</div>`).join('')}${rows}</div>`;
  const frac=(n,d)=>d?`<b>${n}</b> / ${d}`:'—';
  const kg=s=>s.bs.lost!=null&&s.bs.n>1?(s.bs.lost>=0?'−':'+')+f1(Math.abs(s.bs.lost))+' kg':'—';
  const hoje=table(
    row('Treino',s=>tp(s)+tw(s))+
    row('Dieta',s=>s.trolled?'<span class="pill bad">Trolou</span>':'<span class="pill ok">Firme</span>')+
    row('Refeições feitas',s=>frac(s.tt.done,s.tt.total))+
    row('Calorias',s=>`<b>${f0(s.tt.kcal)}</b><div class="tiny faint">de ${f0(s.tg.kcal)}</div>`)+
    row('Leitura',s=>s.rd.page==null?`<b>—</b><div class="tiny faint">hoje ${s.rd.today}</div>`:`pág. <b>${s.rd.page}</b><div class="tiny faint">hoje +${s.rd.today}${s.rd.gap>0?' · faltam '+s.rd.gap:''}</div>`)+
    row('Creatina',s=>s.doses.length?frac(s.creTaken,s.doses.length):'—')+
    row('Peso de hoje',s=>s.ent?f1(s.ent.weight)+' kg':'—'));
  const sem=table(
    row('Treinos feitos',s=>frac(s.tN,s.tD))+
    row('Givou treino',s=>`<b>${s.gvN}</b>`)+
    row('Dias de dieta ✔',s=>frac(s.dN,s.dD))+
    row('Trolou a dieta',s=>`<b>${s.trN}</b>`)+
    row('Págs lidas (7 dias)',s=>`<b>${s.rd.week}</b>`)+
    row('Creatina ✔',s=>frac(s.cN,s.cD))+
    row('Pesagens',s=>`<b>${s.wN}</b>`)+
    row('Sequência treino',s=>`<b>${s.streak}</b>`));
  const tot=table(
    row('Páginas lidas',s=>`<b>${s.rd.total}</b> / ${RD_TOTAL}`)+
    row('Treinos feitos',s=>`<b>${s.sessN}</b>`)+
    row('Volume total',s=>`<b>${f1(s.vol/1000)}</b> t`)+
    row('Peso perdido',s=>kg(s))+
    row('Cintura',s=>s.bs.waistLast!=null?f1(s.bs.waistLast)+' cm':'—'));
  const lossSer=(x)=>{const w=weightsOf(x.p);return {name:x.nm,color:x.c,pts:w.length?w.map(q=>({x:diffDays(q.date,me.start),y:w[0].weight-q.weight})):[]}};
  const ser=all.map(lossSer);
  const x1=Math.max(diffDays(me.end,me.start),...ser.flatMap(s=>s.pts.map(q=>q.x)),1);
  const chart=chartLine('pcmp',{series:ser,epoch:me.start,x0:0,x1,h:210,today:diffDays(todayStr(),me.start),label:'Peso perdido desde a primeira pesagem',yfmt:v=>f1(v)+' kg'});
  /* cobrar */
  const msgs=[];const many=others.length>1;
  others.forEach((o,i)=>{const s=ST[i+1],nm=all[i+1].nm,tag=many?' · '+nm:'';
    if(s.w!=='R'&&!s.trained&&!s.gived)msgs.push(['Cobrar treino'+tag,`E aí, ${nm}! Hoje é treino ${s.w}${s.wk?' ('+s.wk.name+')':''}. Já foi?`]);
    if(!s.trolled&&s.tt.done<s.tt.total)msgs.push(['Cobrar dieta'+tag,`${nm}, como está a dieta hoje? Já registrou as refeições no app?`]);
    if(s.doses.length&&s.creTaken<s.doses.length)msgs.push(['Lembrar creatina'+tag,`${nm}, não esquece da creatina hoje! Já tomou?`]);
    if(s.rd.gap>0)msgs.push(['Cobrar leitura'+tag,`${nm}, e a leitura? ${s.rd.page==null?'Ainda não vi nenhuma página registrada.':'Você está na pág. '+s.rd.page+'.'} Faltam ${s.rd.gap} pág${s.rd.gap>1?'s':''} para a meta de hoje.`]);
    if(s.trained)msgs.push(['Parabéns'+tag,`Boa, ${nm}! Vi que você treinou hoje. Segue assim!`]);
  });
  const pend=all.filter((x,i)=>ST[i].doses.length&&ST[i].creTaken<ST[i].doses.length).map(x=>x.p===me?firstName(me.name):x.nm);
  if(pend.length)msgs.push([pend.length>1?'Avisar o grupo: creatina':'Avisar: creatina',`Hora da creatina, galera! Quem ainda não tomou hoje: ${pend.join(', ')}.`]);
  const cobrarNm=many?'o grupo':esc(all[1].nm);
  return `<div class="stack">
   <div class="card"><div class="ch"><h3>Hoje</h3><span class="small muted">${WD[dow(ST[0].d)]} ${fmtD(ST[0].d)}</span></div>${hoje}</div>
   <div class="card"><div class="ch"><h3>Últimos 7 dias</h3></div>${sem}<p class="tiny faint" style="margin-top:8px">O dia de hoje só entra na conta depois de cumprido. A dieta só conta como ✘ quando a pessoa aperta “Trolei a dieta”.</p></div>
   <div class="card"><div class="ch"><h3>Desde o início</h3></div>${tot}</div>
   <div class="card"><div class="ch"><h3>Perda de peso</h3></div>${chart}</div>
   <div class="card"><div class="ch"><h3>Cobrar ${cobrarNm}</h3></div><p class="small muted" style="margin-bottom:10px">Abre o WhatsApp com a mensagem pronta; você escolhe a conversa (ou o grupo) e envia.</p><div class="row" style="flex-wrap:wrap">${msgs.map(m=>wa(m[0],m[1])).join('')||'<span class="small muted">Nada para cobrar agora.</span>'}</div></div></div>`;
}

/* ----- aba Amigos ----- */
function vPar(){
  if(!cfgOk())return `<div class="card"><p class="muted">A nuvem ainda não foi configurada neste app: o arquivo <b>firebase-config.js</b> ainda tem COLE_AQUI.</p></div>`;
  if(!FB.user)return `<div class="stack"><div class="note"><b>Veja o progresso dos amigos e deixe eles verem o seu.</b> Cada um edita só o seu perfil; os outros só olham. ${FB.ready?'Primeiro entre na sua conta.':''}</div>${friendsCard()}</div>`;
  const L=friendList();
  if(!L.length)return `<div class="stack"><div class="note"><b>Ninguém por aqui ainda.</b> Assim que seus amigos entrarem no app com a conta deles, eles aparecem sozinhos nesta aba.</div>${friendsCard()}</div>`;
  const key=friendSel(),me=S.profiles[S.active];
  const chips=L.length>1?`<div class="seg" style="margin-bottom:12px">${[['all','Grupo']].concat(L.map(f=>[f.uid,firstName(f.name)])).map(([k,l])=>`<button aria-pressed="${key===k}" data-a="pfsel" data-u="${esc(k)}">${esc(l)}</button>`).join('')}</div>`:'';
  if(key==='all'){
    const R=L.filter(f=>f.p),W=L.filter(f=>!f.p);
    const wait=W.length?`<div class="note" style="margin-bottom:12px">Aguardando os dados de ${W.map(f=>esc(firstName(f.name))).join(', ')}.${W.some(f=>f.err==='denied')?' O Firebase ainda não liberou a leitura: veja Ajustes › Amigos.':''}</div>`:'';
    return chips+wait+(R.length?vCompare(me,R,true):friendsCard());
  }
  const f=FR.map[key];
  if(!f.p)return chips+`<div class="stack"><div class="note">${f.err==='denied'?'O Firebase ainda não liberou a leitura dos dados dele. Publique o arquivo firestore.rules novo (veja Ajustes › Amigos).':f.err==='net'?'Sem conexão agora; tento de novo daqui a pouco.':f.err==='empty'?'Ele ainda não sincronizou nenhum dado.':'Buscando os dados dele…'}</div>${friendsCard()}</div>`;
  const p=f.p,cur=S.ui.psec||'resumo';
  const secs=[['resumo','Resumo'],['hoje','Hoje'],['dieta','Dieta'],['treino','Treino'],['corpo','Corpo'],['leitura','Leitura']];
  const bar=`<div class="pbar"><span class="av">${esc((p.name||'?').trim().charAt(0).toUpperCase())}</span><div class="sp" style="min-width:0"><b>${esc(p.name)}</b><div class="small muted">Somente leitura · última atividade ${relT(f.at)}${f.err==='net'?' · sem conexão, mostrando o último que recebi':f.err==='denied'?' · sem acesso agora, mostrando o último que recebi':''}</div></div></div>`;
  const tabs=`<div class="tabs" role="tablist" style="margin-top:12px">${secs.map(([k,l])=>`<button role="tab" aria-selected="${cur===k}" data-a="psec" data-s="${k}">${l}</button>`).join('')}</div>`;
  let inner='';RO=p;
  try{
    switch(cur){
      case 'hoje':inner=vHoje();break;
      case 'dieta':if(sub('dieta','dia')==='alimentos')S.ui.sub.dieta='dia';inner=vDieta();break;
      case 'treino':inner=vTreino();break;
      case 'corpo':inner=vMedidas();break;
      case 'leitura':inner=vLeit();break;
      default:inner=vCompare(me,[f],false);
    }
  }catch(e){console.error(e);inner=`<div class="note warn">Não consegui montar esta tela com os dados dele.</div>`}
  finally{RO=null}
  return chips+bar+tabs+`<div class="rocontent">${inner}</div>`;
}

/* ========== assistente: pessoa nova e dieta sob medida ==========
   Responde a algumas perguntas (objetivo, carboidrato, refeições, o que gosta de comer, treino) e monta
   a dieta no mesmo formato do plano do grupo: metas de carbo alto/baixo, refeições com quantidades e trocas. */
const WZ={mode:'new',step:'basic',d:null,seeds:false};
const FDn=n=>FOODS.find(f=>f.name===n);
const SHORT={'Peito de frango grelhado':'Frango (peito)','Frango sobrecoxa sem pele assada':'Frango sobrecoxa','Coxão mole cozido':'Coxão mole','Patinho cozido':'Patinho','Tilápia grelhada':'Tilápia','Ovo cozido':'Ovo',
 'Arroz branco cozido':'Arroz branco','Batata-doce cozida':'Batata-doce','Batata inglesa cozida':'Batata inglesa','Macarrão cozido':'Macarrão','Feijão carioca cozido':'Feijão',
 'Pão de forma':'Pão de forma','Pão francês':'Pão francês','Aveia em flocos':'Aveia','Queijo minas frescal':'Queijo minas frescal','Mussarela':'Mussarela','Presunto':'Presunto','Requeijão light':'Requeijão light',
 'Iogurte natural':'Iogurte natural','Banana prata':'Banana','Maçã':'Maçã','Pera':'Pera','Mexerica':'Mexerica','Uva':'Uva','Mamão papaia':'Mamão','Azeite de oliva':'Azeite','Vegetais cozidos (média)':'Vegetais'};
const PROT_MAIN=['Peito de frango grelhado','Frango sobrecoxa sem pele assada','Coxão mole cozido','Patinho cozido','Tilápia grelhada'];
const CARB_MAIN=['Arroz branco cozido','Batata-doce cozida','Batata inglesa cozida','Macarrão cozido'];
const BREADS=['Pão de forma','Pão francês','Aveia em flocos'];
const BF_EXTRA=['Ovo cozido','Queijo minas frescal','Mussarela','Presunto','Requeijão light','Iogurte natural'];
const FRUITS=['Banana prata','Maçã','Pera','Mexerica','Uva','Mamão papaia'];
const SNACKS=['Iogurte natural','Ovo cozido','Queijo minas frescal'];
const GOALS=[['cut','Perder gordura · moderado (−20%)'],['cutfast','Perder gordura · forte (−30%)'],['keep','Manter o peso'],['bulk','Ganhar massa (+10%)']];
const GOALK={cut:.8,cutfast:.7,keep:1,bulk:1.1};
const ACTS=[[1.375,'Leve · 1 a 3 treinos/sem'],[1.55,'Moderada · 3 a 5 treinos/sem'],[1.725,'Alta · 6 a 7 treinos/sem']];
const MEAL_SETS={
 3:[['cafe','Café da manhã','07:00'],['main','Almoço','12:30'],['main','Jantar','19:30']],
 4:[['cafe','Café da manhã','07:00'],['main','Almoço','12:30'],['snack','Lanche da tarde','16:30'],['main','Jantar','20:00']],
 5:[['cafe','Café da manhã','07:00'],['snack','Lanche da manhã','10:00'],['main','Almoço','12:30'],['snack','Lanche da tarde','16:00'],['main','Jantar','20:00']],
 6:[['cafe','Café da manhã','07:00'],['snack','Lanche da manhã','10:00'],['main','Almoço','12:30'],['snack','Lanche da tarde','16:00'],['main','Jantar','20:00'],['snack','Ceia','22:30']]};
const WDS=[[1,'Seg'],[2,'Ter'],[3,'Qua'],[4,'Qui'],[5,'Sex'],[6,'Sáb'],[0,'Dom']];
const TITLES={basic:'Sobre você',goal:'Objetivo e calorias',carb:'Carboidrato e refeições',foods:'O que você gosta de comer',train:'Treino e creatina',review:'Confira e crie'};

/* ----- motor: alimentos → refeições ----- */
const mac=L=>L.reduce((a,x)=>{const f=FDn(x.f),k=x.g/100;a.kcal+=f.kcal*k;a.p+=f.p*k;a.c+=f.c*k;a.f+=f.f*k;return a},{kcal:0,p:0,c:0,f:0});
const r5=v=>Math.round(v/5)*5;
function fmtUn(n){if(n===0.5)return '½ un';const fl=Math.floor(n);return (n%1?fl+' e ½':String(n))+' un'}
function amt(name,g){
  const f=FDn(name),u=f.u;
  if(u==='1 fatia'){const n=Math.max(1,Math.round(g/f.g));return n+(n===1?' fatia':' fatias')}
  if(u==='1 un')return fmtUn(Math.max(0.5,Math.round(g/f.g*2)/2));
  if(u==='1 pote')return g===f.g?'1 pote ('+f.g+' g)':g+' g';
  if(u==='1 col. chá')return '1 col. chá';
  return g+' g';
}
const itText=x=>x.txt||((SHORT[x.f]||x.f)+' — '+amt(x.f,x.g));
function compMain(Km,Pm,pr,cb,bean,gpFix){
  const fx=[].concat(bean?[{f:'Feijão carioca cozido',g:80}]:[],[{f:'Vegetais cozidos (média)',g:100,txt:'Vegetais à vontade'},{f:'Azeite de oliva',g:5,txt:'Fio de azeite — 1 col. chá'}]);
  const fm=mac(fx);
  const gp=gpFix||clamp(r5((Pm-fm.p)/(FDn(pr).p/100)),70,280),pm=mac([{f:pr,g:gp}]);
  const gc=clamp(r5((Km-fm.kcal-pm.kcal)/(FDn(cb).kcal/100)),0,420);
  return {items:[{f:cb,g:gc}].concat(fx,[{f:pr,g:gp,pro:true}])};
}
const BF_G={'Ovo cozido':100,'Queijo minas frescal':40,'Mussarela':30,'Presunto':30,'Requeijão light':15,'Iogurte natural':170};
function compCafe(K,bread,extras){
  const E=extras.length?extras:['Ovo cozido'],base=E.map(n=>({f:n,g:BF_G[n]})),bm=mac(base),B=FDn(bread),per=B.kcal/100;
  let g;
  if(bread==='Aveia em flocos')g=clamp(Math.round((K-bm.kcal)/per/10)*10,20,90);
  else{const fr=bread==='Pão francês';let n=(K-bm.kcal)/(per*B.g);n=fr?Math.round(n*2)/2:Math.round(n);n=clamp(n,fr?0.5:1,fr?3:5);g=n*B.g}
  return {items:[{f:bread,g}].concat(base)};
}
const SN_G={'Iogurte natural':170,'Ovo cozido':100,'Queijo minas frescal':40};
const compSnack=(fruit,snack)=>({items:[{f:fruit,g:FDn(fruit).g},{f:snack,g:SN_G[snack]}]});
/* um dia completo para uma meta (kcal, proteína): lanches e café primeiro, almoço e jantar fecham a conta */
function buildDay(T,d,types,ref){
  const fr=d.fruit.length?d.fruit:['Banana prata'],sn=d.snack.length?d.snack:['Iogurte natural'];let si=0;
  const res=types.map(([ty,name,time])=>({ty,name,time}));
  res.forEach(m=>{
    if(m.ty==='cafe'){m.K=T.kcal*.22;m.c=compCafe(m.K,d.bread,d.bfExtra);m.alts=BREADS.filter(b=>b!==d.bread).map(b=>({pre:'',items:compCafe(m.K,b,d.bfExtra).items}))}
    else if(m.ty==='snack'){const f=fr[si%fr.length],s=sn[si%sn.length];si++;m.c=compSnack(f,s);m.alts=SNACKS.filter(x=>x!==s).map(x=>({pre:'',items:compSnack(f,x).items}))}
  });
  const non=res.filter(m=>m.c).reduce((a,m)=>{const x=mac(m.c.items);a.kcal+=x.kcal;a.p+=x.p;return a},{kcal:0,p:0});
  const mains=res.filter(m=>m.ty==='main'),Km=(T.kcal-non.kcal)/mains.length,Pm=(T.p-non.p)/mains.length;
  mains.forEach((m,i)=>{
    m.pr=d.prot[i%d.prot.length];m.cb=d.carb[i%d.carb.length];const rp=ref&&ref.filter(x=>x.ty==='main')[i];m.c=compMain(Km,Pm,m.pr,m.cb,d.bean,rp?rp.c.items.find(x=>x.pro).g:0);
    const pro=m.c.items.find(x=>x.pro),cb=m.c.items[0];m.alts=[];
    d.prot.filter(x=>x!==m.pr).forEach(p2=>{const g2=clamp(r5(pro.g*FDn(m.pr).p/FDn(p2).p),60,300);m.alts.push({pre:`Troque ${SHORT[m.pr]} por `,only:{f:p2,g:g2},items:m.c.items.map(x=>x.pro?{f:p2,g:g2,pro:true}:x)})});
    d.carb.filter(x=>x!==m.cb).forEach(c2=>{const g2=clamp(r5(cb.g*FDn(m.cb).kcal/FDn(c2).kcal),0,500);m.alts.push({pre:`Troque ${SHORT[m.cb]} por `,only:{f:c2,g:g2},items:[{f:c2,g:g2}].concat(m.c.items.slice(1))}) });
    m.alts=m.alts.slice(0,4);
  });
  return res;
}
/* metas a partir das respostas */
function wzTargets(d){
  const w=num(d.weight),h=+d.height,age=num(d.age),lvl={low:.38,bal:.28,high:.22}[d.carbLvl]||.28;let K,P,F,C,clamped=false;
  if(d.numMode==='manual'){
    K=num(d.kcal);P=num(d.p);F=num(d.g);C=num(d.c);
    if(P==null)P=w?r5(1.8*w):r5(K*.28/4);
    if(F==null&&C==null)F=K*lvl/9;
    if(F==null)F=(K-4*P-4*C)/9;
    if(C==null)C=Math.max(0,(K-4*P-9*F)/4);
  }else{
    const tmb=10*w+6.25*h-5*age+(d.sex==='F'?-161:5);K=tmb*(+d.act||1.55)*GOALK[d.goal];
    const mn=d.sex==='F'?1200:1500;if(K<mn){K=mn;clamped=true}
    P=r5(1.8*w);F=Math.max(.6*w,K*lvl/9);C=Math.max(0,(K-4*P-9*F)/4);
  }
  K=Math.round(K/5)*5;P=Math.round(P);F=Math.round(F);C=Math.round(C);
  const nh=d.highDays.length;
  if(!(d.carbStyle==='cycle'&&nh>0&&nh<7))return {cycle:false,clamped,low:{kcal:K,p:P,c:C,g:F},high:{kcal:K,p:P,c:C,g:F}};
  const delta=.16*K,lowK=Math.round((K-delta*nh/7)/5)*5,highK=Math.round((K-delta*nh/7+delta)/5)*5;
  return {cycle:true,clamped,low:{kcal:lowK,p:P,c:Math.max(0,Math.round((lowK-4*P-9*F)/4)),g:F},high:{kcal:highK,p:P,c:Math.max(0,Math.round((highK-4*P-9*F)/4)),g:F}};
}
function wzBuild(d){
  const T=wzTargets(d),types=MEAL_SETS[d.nMeals]||MEAL_SETS[5];
  const lo=buildDay(T.low,d,types),hi=T.cycle?buildDay(T.high,d,types,lo):null;
  const body=a=>a.only?itText(a.only):a.items.map(itText).join(' + ');
  const meals=lo.map((m,i)=>{
    const h=hi?hi[i]:null,ml=mac(m.c.items),mh=h?mac(h.c.items):ml;
    const items=m.c.items.map((it,k)=>{const t=itText(it),th=h?itText(h.c.items[k]):t;return th!==t?{t,hi:th}:{t}});
    const swaps=m.alts.map((a,k)=>{const ah=h?h.alts[k]:null,tl=a.pre+body(a),th=ah?ah.pre+body(ah):tl,am=mac(a.items),amh=ah?mac(ah.items):am;
      return {t:th!==tl?`${tl} · dia alto: ${body(ah)}`:tl,lo:Math.round(am.kcal),hi:Math.round(amh.kcal),p:Math.round(am.p)}});
    return {id:'M'+(i+1),time:m.time,name:m.name,items,lo:Math.round(ml.kcal),hi:Math.round(mh.kcal),p:Math.round(ml.p),swaps,note:m.ty==='cafe'?'Café sem açúcar.':''};
  });
  const rules=['Arroz, feijão, carnes e batatas são sempre pesados já cozidos.','Sem balança? Palma da mão = proteína, punho fechado = carboidrato, ponta do polegar = azeite.']
    .concat(T.cycle?[`Dias de carbo alto (${d.highDays.slice().sort((a,b)=>a-b).map(i=>WD[i]).join(' · ')}): sobe só o carboidrato; proteína e gordura ficam iguais.`]:[])
    .concat(['Valores aproximados (TACO/USDA), margem de ±10%.']);
  return {T,diet:{low:T.low,high:T.high,meals,rules},carbHigh:T.cycle?d.highDays.slice().sort((a,b)=>a-b):[]};
}

/* ----- aplicar no perfil ----- */
function wzApplyDiet(p,d){
  p.prefs={goal:d.goal,act:d.act,numMode:d.numMode==='group'?'calc':d.numMode,carbStyle:d.carbStyle,carbLvl:d.carbLvl,highDays:d.highDays.slice(),nMeals:d.nMeals,prot:d.prot.slice(),carb:d.carb.slice(),bean:d.bean,bread:d.bread,bfExtra:d.bfExtra.slice(),fruit:d.fruit.slice(),snack:d.snack.slice()};
  if(d.numMode==='group'){p.plan.diet=mkDiet('p1');p.plan.carbHigh=[2,4,6];return}
  const B=wzBuild(d);p.plan.diet=B.diet;p.plan.carbHigh=B.carbHigh;
  const w=num(d.weight);if(w)p.plan.water={min:Math.round(w*35/100)*100,max:Math.round(w*45/100)*100};
}
function wzApplyTrain(p,d){
  const days=WDS.map(x=>x[0]).filter(x=>d.trainDays.includes(x)),sched={0:'R',1:'R',2:'R',3:'R',4:'R',5:'R',6:'R'};
  const empty={A:{name:'Treino A',dur:'',phases:[{from:null,label:'',ex:[]}]}};
  if(d.trainModel==='group'){p.plan.workouts=mkWorkouts();const L=['A','B','C','D','E'];days.forEach((x,i)=>{sched[x]=L[i%5]})}
  else if(d.trainModel==='empty'){p.plan.workouts=empty;days.forEach(x=>{sched[x]='A'})}
  else p.plan.workouts=empty;
  p.plan.sched=sched;
}
function wzApplyCre(p,d){
  const c=p.plan.creatine,ev=p.plan.events;
  if(d.cre==='no'){c.off=true;return}
  Object.assign(c,{off:false,start:p.start,end:p.end,satDose:20,satPerDay:4,maintDose:5,satDays:d.cre==='sat'?7:0});
  if(d.cre==='sat'){ev[p.start]=(ev[p.start]||'')+' · creatina: saturação (20 g/dia)';ev[addDays(p.start,7)]='Creatina cai para 5 g/dia (manutenção)'}
  else ev[p.start]=(ev[p.start]||'')+' · creatina: 5 g/dia';
}
function wzGoalKg(p,d){
  if(!(d.goal==='cut'||d.goal==='cutfast'))return [0,0];
  const w=num(d.weight);if(!w||d.numMode==='group')return [0,0];
  const T=wzTargets(Object.assign({},d,{numMode:d.numMode==='manual'?'manual':'calc'})),tmb=10*w+6.25*(+d.height)-5*num(d.age)+(d.sex==='F'?-161:5),td=tmb*(+d.act||1.55);
  const hi=p.plan.carbHigh.length,avg=T.cycle?(hi*T.high.kcal+(7-hi)*T.low.kcal)/7:T.low.kcal;
  const est=Math.max(0,(td-avg)*diffDays(p.end,p.start)/7700);
  return [Math.max(1,Math.round(est*.8*2)/2),Math.max(1.5,Math.round(est*1.2*2)/2)];
}

/* ----- telas ----- */
function wzDefaults(){return {name:'',age:28,sex:'M',height:175,weight:'',goal:'cut',act:1.55,numMode:'calc',kcal:'',p:'',c:'',g:'',
  carbStyle:'cycle',carbLvl:'bal',highDays:[2,4,6],nMeals:5,prot:['Peito de frango grelhado','Coxão mole cozido'],carb:['Arroz branco cozido','Batata-doce cozida'],bean:true,
  bread:'Pão de forma',bfExtra:['Ovo cozido','Queijo minas frescal'],fruit:['Banana prata','Maçã'],snack:['Iogurte natural'],
  trainDays:[1,2,4,5,6],trainModel:'group',cre:'no'}}
function wzOpen(mode,opts){
  opts=opts||{};WZ.mode=mode;WZ.seeds=!!opts.seeds;WZ.d=wzDefaults();
  if(mode==='diet'){
    const p=P(),w=curWeight(p);
    Object.assign(WZ.d,{name:p.name,age:p.age,sex:p.sex||'M',height:Math.round(p.height*100),weight:w==null?'':w});

   Domingos de revisão não entram na contagem de páginas: são só um ✓ ("revisão feita"). */
const RD_ROWS=(()=>{
  const R=[
   ['2026-11-09','3-25','Introdução, estrutura da Bíblia (66 livros) e versões · Panorama geral dos 66 livros e Panorama do Antigo Testamento · Gênesis'],

   ['2026-11-21','120-126','Jonas, Miquéias e Naum'],
   ['2026-11-22','13-15','Revisão: resumos de Samuel a Naum no Panorama geral',1],
   ['2026-11-23','129-130,101-102,127-128','Sofonias, Jeremias e Habacuque'],
   ['2026-11-24','103-104,118-119,114-115','Lamentações, Obadias e Joel'],
   ['2026-11-25','105-109,75-77','Ezequiel, Daniel e, depois, Esdras'],
   ['2026-11-26','131-134,81-84','Ageu, Zacarias e Ester'],
   ['2026-11-27','78-80,135-140','Neemias, Malaquias e período interbíblico'],
   ['2026-11-28','141-153','Introdução ao Novo Testamento e aos Evangelhos; Mateus, Marcos e Lucas'],
   ['2026-11-29','13-15','Revisão: resumos de Esdras a Ester e de Jeremias a Malaquias',1],
   ['2026-11-30','154-163','João'],
   ['2026-12-01','164-166,174-175,182-185','Atos, Gálatas e 1 e 2 Tessalonicenses'],
   ['2026-12-02','170-173,167-169','1 e 2 Coríntios e, depois, Romanos'],
   ['2026-12-03','176-181,192-193','Efésios, Filipenses, Colossenses e Filemom'],
   ['2026-12-04','186-191','1 e 2 Timóteo e Tito'],
   ['2026-12-05','194-202','Hebreus, Tiago, 1 e 2 Pedro'],
   ['2026-12-06','15-16','Revisão: resumos de Mateus a Judas no Panorama geral',1],
   ['2026-12-07','203-210','1, 2 e 3 João e Judas'],
   ['2026-12-08','211-216','Apocalipse (opcional: reler o Panorama geral, p. 12–16)']];
  let cum=0;
  return R.map(([d,pg,t,rev])=>{
    const rg=pg.split(',').map(x=>x.split('-').map(Number)).map(([a,b])=>[a,b==null||isNaN(b)?a:b]);
    const n=rev?0:rg.reduce((s,[a,b])=>s+b-a+1,0),a=cum;cum+=n;
    return {d,pg,t,rev:!!rev,n,a,b:cum,rg}
  });
})();
const RD_SEQ=RD_ROWS.filter(r=>!r.rev).flatMap(r=>r.rg.flatMap(([a,b])=>Array.from({length:b-a+1},(_,i)=>a+i)));
const RD_TOTAL=RD_SEQ.length, RD_START=RD_ROWS[0].d, RD_END=RD_ROWS[RD_ROWS.length-1].d;
const rdRow=d=>RD_ROWS.find(r=>r.d===d);
const rdCumAt=d=>RD_ROWS.reduce((s,r)=>r.d<=d?r.b:s,0);               /* páginas previstas até o fim do dia d */
const rdTotal=p=>{let n=0;for(const k in p.days)n+=Math.max(0,+p.days[k].read||0);return Math.min(n,RD_TOTAL)};
const rdPage=p=>{const n=rdTotal(p);return n>0?RD_SEQ[n-1]:null};
const rdReadOn=(p,d)=>Math.max(0,+(p.days[d]&&p.days[d].read)||0);
const rdRevOn=(p,d)=>!!(p.days[d]&&p.days[d].rev);
const rdGap=(p,d=todayStr())=>rdCumAt(d)-rdTotal(p);                    /* >0 atrasado, <0 adiantado */
const rdFmt=s=>{const a=String(s).split(',').map(x=>x.replace('-','–'));return a.length>1?a.slice(0,-1).join(', ')+' e '+a[a.length-1]:a[0]};
const rdPg=s=>(/[–,-]/.test(s)?'págs. ':'pág. ')+rdFmt(s);
const rdN=n=>`${n} pág${n===1?'':'s'}`;
function rdWeek(p){let n=0;for(let i=0;i<7;i++)n+=rdReadOn(p,addDays(todayStr(),-i));return n}
/* soma n páginas no dia d; n negativo tira primeiro do próprio dia e depois dos dias anteriores */
function rdAdjust(p,d,n){
  if(n>0){const add=Math.min(n,RD_TOTAL-rdTotal(p));if(add>0){const dl=ensureDay(p,d);dl.read=rdReadOn(p,d)+add}return add}
  let rem=-n,took=0;
  for(const k of Object.keys(p.days).filter(k=>k<=d&&rdReadOn(p,k)>0).sort().reverse()){
    const t=Math.min(rem,rdReadOn(p,k));p.days[k].read=rdReadOn(p,k)-t;rem-=t;took+=t;if(!rem)break}
  return -took;
}
function rdBadge(p){
  const t=todayStr(),tot=rdTotal(p);
  if(tot>=RD_TOTAL)return ['ok','Plano concluído'];
  if(t<RD_START)return tot>0?['ok',`Adiantado: ${rdN(tot)}`]:['',`Começa ${fmtD(RD_START)}`];
  const gap=rdGap(p,t);
  if(gap>0)return ['warn',t>RD_END?`Faltam ${rdN(gap)}`:`Faltam ${rdN(gap)} p/ a meta`];
  return gap<0?['ok',`${rdN(-gap)} à frente`]:['ok','Em dia'];
}
function rdWhere(p){const pg=rdPage(p);return pg==null?'ainda não começou':'está na pág. <b>'+pg+'</b>'}
