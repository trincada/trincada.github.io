<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0A8878" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0C131A" media="(prefers-color-scheme: dark)"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/favicon.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TRINCADA">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="firebase-config.js"></script>
<title>TRINCADA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: trilho lateral no desktop, barra inferior no celular; cartões de uma coluna que viram duas no desktop.
   Cores do plano: laranja = carbo alto, azul = carbo baixo (mesma legenda da planilha). Verde-água = ação e progresso. */
:root{
  --bg:#EBEFF2; --surface:#FFFFFF; --surface2:#F4F7F9; --ink:#101A24; --ink2:#4A5866; --ink3:#76848F; --line:#D8DFE5;
  --brand:#0A8878; --brand-ink:#FFFFFF; --brand-soft:#DCF2EE;
  --hi:#D96A0C; --hi-soft:#FBE8D5; --lo:#2B6CC9; --lo-soft:#DCE8F8; --rest:#8A96A1; --rest-soft:#E6EAEE;
  --ok:#1B8F52; --ok-soft:#DDF3E6; --warn:#A57300; --warn-soft:#FFF1C2; --bad:#C93A3A; --bad-soft:#FBE0E0;
  --info-soft:#DCE8F8; --shadow:0 1px 2px rgba(16,26,36,.06),0 4px 14px rgba(16,26,36,.05);
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C131A; --surface:#151F29; --surface2:#1B2733; --ink:#E9EFF4; --ink2:#A9B6C2; --ink3:#7C8A97; --line:#2A3946;
  --brand:#33C4AE; --brand-ink:#06201C; --brand-soft:#12383A;
  --hi:#F3984A; --hi-soft:#3B2815; --lo:#6FA5F2; --lo-soft:#17294A; --rest:#8A98A5; --rest-soft:#222F3B;
  --ok:#4CCB87; --ok-soft:#133726; --warn:#E6B73C; --warn-soft:#3C3010; --bad:#F07474; --bad-soft:#40191B;
  --info-soft:#17294A; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C131A; --surface:#151F29; --surface2:#1B2733; --ink:#E9EFF4; --ink2:#A9B6C2; --ink3:#7C8A97; --line:#2A3946;
  --brand:#33C4AE; --brand-ink:#06201C; --brand-soft:#12383A;
  --hi:#F3984A; --hi-soft:#3B2815; --lo:#6FA5F2; --lo-soft:#17294A; --rest:#8A98A5; --rest-soft:#222F3B;
  --ok:#4CCB87; --ok-soft:#133726; --warn:#E6B73C; --warn-soft:#3C3010; --bad:#F07474; --bad-soft:#40191B;
  --info-soft:#17294A; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
html,body{overscroll-behavior-y:none}
input,select,textarea{font-size:16px!important}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:600;letter-spacing:.01em;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)} .faint{color:var(--ink3)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.upper{text-transform:uppercase;letter-spacing:.07em;font-size:11.5px;font-weight:600;color:var(--ink3)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* shell: layout de celular em qualquer tela (coluna única + barra de abas embaixo) */
.app{display:block;min-height:100vh}
.main{min-width:0;padding-block:12px calc(92px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));max-width:560px;width:100%;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px))}
.tabbar .tbi{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);max-width:560px;margin:0 auto}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;color:var(--ink3);font-size:11px;font-weight:600;border-radius:10px;min-width:0;min-height:52px}
.tabbar button svg{width:23px;height:23px}
.tabbar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabbar button[aria-current="page"]{color:var(--brand)}
.tabbar button[aria-current="page"] svg{stroke-width:2.3}

/* top */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 6px;font-weight:600}
.who .av{width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:15px;font-weight:700}
.datenav{display:flex;align-items:center;gap:4px;margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.datenav button{border:0;background:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.datenav button:hover{background:var(--surface2)}
.datenav .dl{padding:0 8px;font-weight:600;min-width:112px;text-align:center;font-size:14px;cursor:pointer;border:0;background:none;height:34px;width:auto;border-radius:999px}
.sync{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:5px}
#syncdot:not(.on):not(.err){display:none}
#syncdot{position:fixed;top:calc(env(safe-area-inset-top,0px) + 5px);right:8px;z-index:25;padding:3px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--rest);display:inline-block}
.sync.on i{background:var(--ok)} .sync.err i{background:var(--bad)}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card>h3,.card .ch{font-size:20px;margin-bottom:10px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card .ch h3{font-size:20px}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}

.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--rest-soft);color:var(--ink2);white-space:nowrap}
.pill.hi{background:var(--hi-soft);color:var(--hi)} .pill.lo{background:var(--lo-soft);color:var(--lo)} .pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.brand{background:var(--brand-soft);color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 15px;border-radius:11px;font-weight:600;font-size:15px;min-height:46px;line-height:1.1}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)} .btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:7px 12px;min-height:38px;font-size:14px;border-radius:9px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)} .btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn svg,.ico{width:18px;height:18px;flex:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--ink2);min-height:40px}
.seg button:hover,.chip:hover{background:var(--surface2)}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.seg button.s-skip[aria-pressed="true"]{background:var(--rest);border-color:var(--rest);color:#fff}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;flex:1 0 auto;padding:10px 12px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink2);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-height:46px;color:var(--ink);font-weight:500;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.bar{height:9px;border-radius:999px;background:var(--rest-soft);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .25s}
.bar.hi>i{background:var(--hi)} .bar.lo>i{background:var(--lo)} .bar.over>i{background:var(--warn)}
.kv{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.big{font-family:var(--f-display);font-weight:600;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:16px;font-weight:500;color:var(--ink3);margin-left:3px}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.tile{background:var(--surface2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .v{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;color:var(--ink3);font-weight:500}
.note{border-radius:10px;padding:10px 12px;font-size:13.5px;background:var(--info-soft)}
.note.warn{background:var(--warn-soft)} .note.ok{background:var(--ok-soft)} .note.bad{background:var(--bad-soft)}
.empty{text-align:center;color:var(--ink3);padding:22px 10px;border:1px dashed var(--line);border-radius:12px;font-size:14px}
.sep{height:1px;background:var(--line);margin:12px 0;border:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
table.tbl th{background:var(--surface2);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);padding:8px 10px;white-space:nowrap;position:sticky;top:0}
table.tbl td{padding:8px 10px;border-top:1px solid var(--line);white-space:nowrap}
table.tbl td.wrap{white-space:normal}
.pos{color:var(--ok)} .neg{color:var(--bad)}

/* hero */
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--rest)}
.hero.hi::before{background:var(--hi)} .hero.lo::before{background:var(--lo)}
.hero .dn{font-family:var(--f-display);font-size:64px;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums}
.hero .dt{display:flex;flex-direction:column;gap:2px}
.hero .dt b{font-size:18px}
.hero .pills{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
@media (max-width:560px){.hero .pills{margin-left:0;width:100%}}

/* meal */
.meal{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:9px;min-width:0}
.meal.st-plan,.meal.st-swap,.meal.st-custom{border-color:color-mix(in srgb,var(--brand) 55%,var(--line));background:color-mix(in srgb,var(--brand-soft) 35%,var(--surface))}
.meal.st-skip{opacity:.72}
.meal header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.meal .mt{font-family:var(--f-display);font-size:19px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums}
.meal h4{font-size:20px}
.meal .mk{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.meal ul{margin:0;padding-left:18px;color:var(--ink)} .meal li{margin:1px 0}
.meal li .alt{color:var(--ink3);font-size:12.5px}
.swapbox{background:var(--surface2);border-radius:9px;padding:9px 11px;font-size:13.5px}
.foodrow{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.foodrow .fn{min-width:0;overflow-wrap:anywhere}
.iconbtn{border:0;background:none;width:42px;height:42px;border-radius:8px;display:grid;place-items:center;color:var(--ink3)}
.iconbtn:hover{background:var(--surface2);color:var(--ink)} .iconbtn.del:hover{color:var(--bad)}

/* workout */
.ex{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface);min-width:0}
.ex.complete{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.ex header{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ex h4{font-size:20px}
.ex .pl{color:var(--ink2);font-size:13.5px}
.setrow{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 48px;gap:8px;align-items:center}
.setrow .sn{font-family:var(--f-display);font-size:18px;color:var(--ink3);text-align:center}
.setrow input{text-align:center;font-variant-numeric:tabular-nums}
.chk{width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);display:grid;place-items:center;color:transparent}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.ssb{background:var(--lo-soft);color:var(--lo);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;letter-spacing:.05em}
#rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 10px 8px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
#rest .rt{font-family:var(--f-display);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;min-width:68px}
#rest button{border:0;background:rgba(127,127,127,.28);color:inherit;border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px}


/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{font-size:11.5px;font-weight:700;text-align:center;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding-bottom:2px}
.cd{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:5px 5px 6px;min-height:76px;display:flex;flex-direction:column;gap:3px;text-align:left;position:relative;overflow:hidden;min-width:0}
.cd::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--rest)}
.cd.hi::before{background:var(--hi)} .cd.lo::before{background:var(--lo)}
.cd.off{background:transparent;border-style:dashed;opacity:.55}
.cd.today{outline:2px solid var(--brand);outline-offset:1px}
.cd.sel{background:var(--brand-soft)}
.cd .n{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1;margin-top:4px}
.cd .t{font-size:10.5px;font-weight:700;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd .dots{display:flex;gap:3px;margin-top:auto;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink3);display:inline-block}
.dot.on{background:var(--ok);border-color:var(--ok)}
.dot.no{border-color:var(--bad);background:var(--bad)}
.dot.w.on{background:var(--lo);border-color:var(--lo)} .dot.c.on{background:var(--hi);border-color:var(--hi)}
.cd .ev{position:absolute;right:4px;top:9px;width:7px;height:7px;border-radius:2px;background:var(--brand);transform:rotate(45deg)}
@media (max-width:520px){.cal{gap:3px}.cd{min-height:62px;padding:4px 3px}.cd .t{display:none}.cd .n{font-size:17px}.dot{width:7px;height:7px}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}

/* charts */
.chart{position:relative;width:100%;min-height:120px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--ink3);font-variant-numeric:tabular-nums}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 9px;font-size:12px;line-height:1.35;white-space:nowrap;z-index:5;transform:translate(-50%,-100%);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:6px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:14px;height:3px;border-radius:2px;display:inline-block}

/* modal + toast */
.ov{position:fixed;inset:0;z-index:60;background:rgba(8,14,20,.55);display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.modal.wide{max-width:760px}

.modal h3{font-size:24px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:-18px;background:var(--surface);padding-top:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
#toast div{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.3)}

.foodlist{display:flex;flex-direction:column;max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.foodlist button{border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:9px 11px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.foodlist button:first-child{border-top:0} .foodlist button:hover{background:var(--surface2)}
.photos{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.photo{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
.photo img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.photo .cap{padding:6px 8px;font-size:12px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
details.acc{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
details.acc>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:20px;font-weight:600}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg);transition:transform .15s}
details.acc[open]>summary::after{transform:rotate(-135deg)}
details.acc .accb{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.edrow{display:grid;grid-template-columns:minmax(0,2fr) 54px 74px minmax(0,1.3fr) 60px auto;gap:6px;align-items:center}
@media (max-width:640px){.edrow{grid-template-columns:minmax(0,1fr) 1fr 1fr;} .edrow .nm{grid-column:1/-1}}
.edrow input{padding:7px 8px;min-height:42px}
#rest[hidden],.tip[hidden],.ov[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* tela do amigo: somente leitura (só navegação fica ativa) */
.rocontent [data-a]{pointer-events:none}
.rocontent [data-a="sub"],.rocontent [data-a="goday"],.rocontent [data-a="godieta"],.rocontent [data-a="gotreino"],.rocontent [data-a="tab"],.rocontent [data-a="histf"]{pointer-events:auto}
.rocontent input,.rocontent select,.rocontent textarea{pointer-events:none}
.rocontent select[data-c="exsel"],.rocontent select[data-c="msel"]{pointer-events:auto}
.rocontent .chk,.rocontent .seg button[data-a],.rocontent .iconbtn{opacity:.55}
.who svg{width:16px;height:16px;opacity:.55;margin-left:2px}
.menu{display:grid;gap:6px}.menu .btn{justify-content:space-between;min-height:48px;font-size:15px}.menu .btn svg{width:18px;height:18px;opacity:.5}
.pbar{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}
.pbar .av{width:38px;height:38px;border-radius:50%;background:var(--lo);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:20px;font-weight:700;flex:none}
.codebox{font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;user-select:all}
.cmpg{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13.5px;font-variant-numeric:tabular-nums}
.cmpg>div{padding:9px 10px;border-top:1px solid var(--line);min-width:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;column-gap:4px;row-gap:3px}
.cmpg>div:nth-child(3n+1){justify-content:flex-start}
.cmpg>div .tiny{flex-basis:100%;text-align:center}
.cmpg>div.h{background:var(--surface2);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700;border-top:0}

const SYNC={state:'local',msg:'Salvo só neste navegador',ref:null,last:{},timer:null,busy:false};
function monthOf(d){return d.slice(0,7)}
function toParts(st){
  const out={};
  const meta={v:st.v,mig:st.mig,updatedAt:st.updatedAt,active:st.active,onboarded:st.onboarded,partner:st.partner||null,foods:st.foods,profiles:{}};
  for(const [id,p] of Object.entries(st.profiles)){
    const {days,sessions,body,...rest}=p;meta.profiles[id]=rest;
    const dm={},sm={};
    for(const [d,v] of Object.entries(days||{})){(dm[monthOf(d)]=dm[monthOf(d)]||{})[d]=v}
    for(const s of (sessions||[])){(sm[monthOf(s.date)]=sm[monthOf(s.date)]||[]).push(s)}
    for(const [m,v] of Object.entries(dm))out[`d_${id}_${m}`]=JSON.stringify(v);
    for(const [m,v] of Object.entries(sm))out[`s_${id}_${m}`]=JSON.stringify(v);
    out[`b_${id}`]=JSON.stringify(body||[]);
  }
  out.meta=JSON.stringify(meta);

}
function fromParts(parts){
  if(!parts.meta)return null;
  const meta=JSON.parse(parts.meta);const st={v:meta.v,mig:meta.mig,updatedAt:meta.updatedAt,active:meta.active,onboarded:meta.onboarded,partner:meta.partner||null,foods:meta.foods||[],ui:S.ui,profiles:{}};
  for(const [id,p] of Object.entries(meta.profiles)){st.profiles[id]=Object.assign({},p,{days:{},sessions:[],body:[]})}
  for(const [k,j] of Object.entries(parts)){
    if(k==='meta')continue;const m=k.match(/^([dsb])_(p[^_]*|[^_]+)(?:_(\d{4}-\d{2}))?$/);if(!m)continue;
    const pr=st.profiles[m[2]];if(!pr)continue;const v=JSON.parse(j);

}
function setSync(state,msg){SYNC.state=state;SYNC.msg=msg;const el=$('#syncline');if(el)el.outerHTML=syncHtml();const d=$('#syncdot');if(d){d.className='sync '+(state==='on'?'on':state==='err'?'err':'');d.title=msg;d.setAttribute('aria-label',msg)}}
const syncHtml=()=>`<span id="syncline" class="sync ${SYNC.state==='on'?'on':SYNC.state==='err'?'err':''}"><i></i>${esc(SYNC.msg)}</span>`;

async function syncPull(){
  setSync('local','Conectando à nuvem…');

  snap.docs.forEach(d=>{const v=d.data();if(v&&typeof v.j==='string')remote[d.id]=v.j});
  let rs=null;try{rs=fromParts(remote)}catch(e){rs=null}
  /* a nuvem vence se for mais nova, ou se este aparelho ainda está "zerado" e a nuvem já tem registros */
  if(rs&&((rs.updatedAt||0)>(S.updatedAt||0)||(hasData(rs)&&!hasData(S)))){
    S=rs;S.ui=S.ui||{tab:'hoje',sub:{}};S.ui.sub=S.ui.sub||{};S.foods=S.foods||[];if(!S.profiles[S.active])S.active=Object.keys(S.profiles)[0];
    if(migrate(S))S.updatedAt=Date.now();

  }else{SYNC.last=Object.assign({},remote)}

}
async function initSync(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;const id=await user.id();if(!id)return;
    SYNC.ref=db.doc('data/users/'+id+'/fl').collection('parts');
    await syncPull();
  }catch(e){setSync('local','Salvo só neste navegador')}
}
function scheduleSync(now){if(!SYNC.ref)return;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(pushSync,now?300:2500)}
async function pushSync(){
  if(!SYNC.ref||SYNC.busy)return;SYNC.busy=true;
  try{
    const parts=toParts(S);const ts=S.updatedAt;
    for(const [k,j] of Object.entries(parts)){
      if(SYNC.last[k]===j)continue;
      await SYNC.ref.doc(k).set({j,t:ts});SYNC.last[k]=j;
    }
    for(const k of Object.keys(SYNC.last)){
      if(!(k in parts)&&k!=='meta'){const empty=k[0]==='b'?'[]':k[0]==='d'?'{}':'[]';if(SYNC.last[k]!==empty){await SYNC.ref.doc(k).set({j:empty,t:ts});SYNC.last[k]=empty}}
    }

}

  const st=getDay(p,d).meals[m.id];if(!st||!st.s||st.s==='skip')return {kcal:0,p:0,c:0,f:0,on:!!st,approx:false};
  const hi=isHigh(p,d),tg=dayTarget(p,d);let k=0,pr=0,approx=false,c=0,f=0;
  if(st.s==='plan'||st.s==='swap'){
    const src=st.s==='plan'?m:m.swaps[st.i];if(!src)return {kcal:0,p:0,c:0,f:0,on:false};
    k=hi?src.hi:src.lo;pr=src.p;c=tg.c*k/tg.kcal;f=tg.g*k/tg.kcal;approx=true;

    if(st&&st.s&&st.s!=='skip'){t.done++}if(st&&st.s)t.logged++;t.kcal+=r.kcal;t.p+=r.p;t.c+=r.c;t.f+=r.f}

  const t=dayTotals(p,d);if(!t.logged)return null;return t.done>=Math.ceil(t.total*0.8)}
/* creatina */
function creDoses(p,d){

    return Array.from({length:c.satPerDay},(_,i)=>({t:times[i]||'—',g:per,phase:'Saturação'}))}

const CH={};
function niceTicks(lo,hi,n=4){

function svgLine(sp,W){
  const H=sp.h,m={l:42,r:14,t:12,b:26};const iw=W-m.l-m.r,ih=H-m.t-m.b;

  });

  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(sp.label||'gráfico')}">${g}<line class="cur" x1="0" x2="0" y1="${m.t}" y2="${H-m.b}" stroke="var(--ink3)" opacity="0"/></svg>`;
}
function svgBar(sp,W){
  const H=sp.h,m={l:42,r:8,t:12,b:26};const iw=W-m.l-m.r,ih=H-m.t-m.b;const bars=sp.bars;
  if(!bars.length)return `<div class="empty">Sem dados ainda</div>`;
  let y1=Math.max(...bars.map(b=>Math.max(b.y||0,b.t||0)),1);const tk=niceTicks(0,y1*1.05,4);y1=tk[tk.length-1];
  const Y=y=>m.t+(1-y/y1)*ih;const bw=iw/bars.length;let g='';
  tk.forEach(v=>{g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${(sp.yfmt||f0)(v)}</text>`});
  const every=Math.ceil(bars.length/Math.floor(iw/46));
  bars.forEach((b,i)=>{const x=m.l+i*bw+bw*.16,w=bw*.68;
    if(b.y>0)g+=`<rect x="${x}" y="${Y(b.y)}" width="${w}" height="${Y(0)-Y(b.y)}" rx="3" fill="${b.color||'var(--brand)'}" opacity="${b.dim?.45:1}"/>`;
    if(b.t)g+=`<line x1="${x-2}" x2="${x+w+2}" y1="${Y(b.t)}" y2="${Y(b.t)}" stroke="var(--ink)" stroke-width="2"/>`;
    if(i%every===0)g+=`<text x="${x+w/2}" y="${H-7}" text-anchor="middle">${esc(b.x)}</text>`});
  sp._geo={m,W,H,bw};
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(sp.label||'gráfico')}">${g}</svg>`;
}
function bindTip(el,sp){
  const svg=el.querySelector('svg');if(!svg||!sp._geo)return;
  const tipEl=document.createElement('div');tipEl.className='tip';tipEl.hidden=true;el.appendChild(tipEl);
  const mv=ev=>{
    const r=svg.getBoundingClientRect();const px=(ev.clientX-r.left)*(sp._geo.W/r.width);let html='',x=0;
    if(sp.type==='bar'){const i=clamp(Math.floor((px-sp._geo.m.l)/sp._geo.bw),0,sp.bars.length-1);const b=sp.bars[i];html=b.tip;x=sp._geo.m.l+i*sp._geo.bw+sp._geo.bw/2}
    else{const xv=sp._geo.x0+(px-sp._geo.m.l)/(sp._geo.W-sp._geo.m.l-sp._geo.m.r)*(sp._geo.x1-sp._geo.x0);
      const base=sp.series.find(s=>!s.nodots&&s.pts.length)||sp.series[0];if(!base)return;
      let best=base.pts[0];for(const p of base.pts)if(Math.abs(p.x-xv)<Math.abs(best.x-xv))best=p;
      html=`<b>${fmtD(addDays(sp.epoch,best.x))}</b><br>`+sp.series.filter(s=>!s.nodots).map(s=>{let q=s.pts[0];for(const p of s.pts)if(Math.abs(p.x-best.x)<Math.abs(q.x-best.x))q=p;return Math.abs(q.x-best.x)<=3?`${esc(s.name)}: ${(sp.yfmt||f1)(q.y)}`:''}).filter(Boolean).join('<br>');
      x=sp._geo.X(best.x);const c=svg.querySelector('.cur');if(c){c.setAttribute('x1',x);c.setAttribute('x2',x);c.setAttribute('opacity','.5')}}
    if(!html){tipEl.hidden=true;return}
    tipEl.innerHTML=html;tipEl.hidden=false;tipEl.style.left=clamp(x*(r.width/sp._geo.W),50,r.width-50)+'px';tipEl.style.top='8px';
  };
  svg.addEventListener('pointermove',mv);svg.addEventListener('pointerdown',mv);
  svg.addEventListener('pointerleave',()=>{tipEl.hidden=true;const c=svg.querySelector('.cur');if(c)c.setAttribute('opacity','0')});
}

   <div class="bar ${hi?'hi':'lo'} ${t.kcal>tg.kcal*1.1?'over':''}" style="margin:10px 0 14px"><i style="width:${pc(t.kcal/tg.kcal)}%"></i></div>

   <p class="tiny faint" style="margin-top:10px">Refeições do plano contam kcal e proteína exatas; carboidrato e gordura são proporcionais ao total do dia (≈). Margem do plano: ±10%.</p></div>`;

const TW={};            // treino escolhido por dia (antes de iniciar)
let RT=null;
const mmss=s=>pad(Math.floor(s/60))+':'+pad(s%60);
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();setTimeout(()=>{o.stop();c.close()},350);if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}}
function startRest(sec){stopRest(true);S.ui.restSec=sec;RT={end:Date.now()+sec*1000,total:sec};drawRest();RT.iv=setInterval(tickRest,250)}
function stopRest(silent){if(RT){clearInterval(RT.iv);RT=null}const r=$('#rest');if(r)r.hidden=true}
function drawRest(){const r=$('#rest');if(!r||!RT)return;r.hidden=false;r.innerHTML=`${ico('timer')}<span class="rt">${mmss(Math.max(0,Math.ceil((RT.end-Date.now())/1000)))}</span><button data-a="rest" data-v="45">45</button><button data-a="rest" data-v="60">60</button><button data-a="rest" data-v="90">90</button><button data-a="reststop" aria-label="Parar">${ico('x')}</button>`}
function tickRest(){if(!RT)return;const left=Math.ceil((RT.end-Date.now())/1000);if(left<=0){stopRest();beep();toast('Descanso terminado, próxima série');return}const t=$('#rest .rt');if(t)t.textContent=mmss(left)}
let WL=null;
async function keepAwake(on){try{if(on&&!WL&&navigator.wakeLock&&document.visibilityState==='visible'){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}else if(!on&&WL){await WL.release();WL=null}}catch(e){WL=null}}
function wantAwake(){const s=sessionOf(P(),todayStr());return !!(s&&!s.finished)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake(wantAwake())});

function exsFor(p,wid,d){const wk=p.plan.workouts[wid];if(!wk)return [];return wk.phases[phaseOf(wk,d)].ex}
function perfText(lp){if(!lp)return '';const ds=lp.ex.sets.filter(x=>x.done);const u=lp.ex.unit==='s'?' s':'';return `Último (${fmtD(lp.date)}): ${ds.map(x=>(num(x.kg)?f1(num(x.kg),num(x.kg)%1?1:0)+' kg × ':'')+(x.reps||'?')+u).join(' · ')}`}
function progHint(lp,e){if(!lp||!e.reps||e.unit==='s')return '';const top=topRep(e.reps);if(!top)return '';
  const ds=lp.ex.sets.filter(x=>x.done);if(ds.length&&ds.length>=e.sets&&ds.every(x=>num(x.reps)>=top))return `<span class="pill ok">Fechou todas as reps: suba o menor degrau</span>`;return ''}
function vTSessao(){
  const p=P(),d=D(),sch=schedOf(p,d);let s=sessionOf(p,d);const wids=Object.keys(p.plan.workouts);
  if(!wids.length)return `<div class="empty">Nenhum treino cadastrado. Crie em Plano.</div>`;
  const wid=s?s.wid:(TW[d]||(sch!=='R'&&p.plan.workouts[sch]?sch:wids[0]));
  const wk=p.plan.workouts[wid];const ph=wk?wk.phases[phaseOf(wk,d)]:null;
  const head=`<div class="card" style="margin-bottom:14px"><div class="row"><div class="sp"><span class="upper">${s?'Treino de '+WD[dow(d)]+' '+fmtD(d):sch==='R'?'Dia de descanso no plano':'Treino do dia'}</span>
    <h3 style="font-size:26px">${s||sch!=='R'?`${wid} — ${esc(wk?wk.name:'')}`:'Escolha um treino extra'}</h3><div class="small muted">${wk?esc(wk.dur||''):''}${ph&&ph.label?' · '+esc(ph.label):''}</div></div>
    ${s?`<span class="pill ${s.finished?'ok':'warn'}">${s.finished?'Concluído':'Em andamento'}</span>`:''}</div>
    ${!s?`<div class="row" style="margin-top:10px"><label class="f" style="flex-direction:row;align-items:center;gap:8px">Treino<select id="wsel" data-c="wsel" style="width:auto">${wids.map(k=>`<option value="${k}" ${k===wid?'selected':''}>${k} — ${esc(p.plan.workouts[k].name)}</option>`).join('')}</select></label></div>`:''}
    ${wk&&wk.note?`<p class="small muted" style="margin-top:8px">${esc(wk.note)}</p>`:''}</div>`;
  if(!wk)return head;
  if(!s){
    const exs=exsFor(p,wid,d);
    return head+`<div class="stack">${exs.map(e=>{const lp=lastPerf(p,e.name);return `<div class="ex"><header><h4>${e.ss?`<span class="ssb">SUPERSET ${e.ss}</span> `:''}${esc(e.name)}</h4><span class="pl num">${e.sets} × ${esc(e.reps)} · ${esc(e.load)}</span></header>${lp?`<div class="small muted">${perfText(lp)}</div>`:''}</div>`}).join('')}
    <div class="row"><button class="btn pri" data-a="startsess" data-w="${wid}">${ico('timer')}Iniciar treino</button><span class="small muted">${exs.length} exercícios · aquecimento: 5–8 min leve + 1–2 séries leves do 1º exercício</span></div></div>`;
  }
  const vol=setsVol(s),sd=setsDone(s);
  return head+`<div class="tiles" style="margin-bottom:14px"><div class="tile"><span class="upper">Tempo</span><span class="v" id="elapsed">${s.finished?(s.dur!=null?s.dur+'':'—'):mmss(Math.floor((Date.now()-(s.startTs||Date.now()))/1000))}</span>${s.finished?'<span class="small muted">minutos</span>':''}</div>
   <div class="tile"><span class="upper">Séries feitas</span><span class="v" id="sdone">${sd}<small> / ${s.exercises.reduce((a,e)=>a+e.sets.length,0)}</small></span></div>
   <div class="tile"><span class="upper">Volume</span><span class="v" id="svol">${f0(vol)}<small> kg</small></span></div></div>
  <div class="stack">${s.exercises.map((e,i)=>exCard(p,s,e,i)).join('')}
   <div class="row"><button class="btn" data-a="addex">${ico('plus')}Exercício extra</button></div>
   <div class="card"><label class="f">Anotações do treino<textarea id="snote" data-i="snote" placeholder="Como foi a energia, dor no tornozelo, cargas que subiram…">${esc(s.notes||'')}</textarea></label>
    <div class="row" style="margin-top:12px">${s.finished?`<label class="f" style="flex-direction:row;align-items:center;gap:8px">Duração (min)<input type="number" inputmode="numeric" data-i="sdur" value="${s.dur??''}" style="width:90px"></label><button class="btn" data-a="reopen">Reabrir</button>`
      :`<button class="btn pri" data-a="finish">${ico('check')}Finalizar treino</button>`}<span class="sp"></span><button class="btn danger sm" data-a="delsess">${ico('trash')}Excluir sessão</button></div></div></div>`;
}

function exCard(p,s,e,i){
  const lp=lastPerf(p,e.name,s.date);const all=e.sets.length&&e.sets.every(x=>x.done);const u=e.unit==='s';
  const top=topRep(e.reps);
  return `<div class="ex ${all?'complete':''}" id="ex_${i}"><header><h4>${e.ss?`<span class="ssb">SS ${e.ss}</span> `:''}${esc(e.name)}</h4><span class="pl num">${esc(e.plan)} · ${esc(e.load)}</span></header>
   ${lp?`<div class="small muted">${perfText(lp)}</div>`:''}${lp?progHint(lp,{reps:e.reps,sets:e.plan?parseInt(e.plan):e.sets.length,unit:e.unit}):''}
   <div class="setrow upper" style="font-size:10.5px"><span></span><span style="text-align:center">${u?'—':'kg'}</span><span style="text-align:center">${u?'segundos':'reps'}</span><span></span></div>
   ${e.sets.map((x,k)=>`<div class="setrow"><span class="sn">${k+1}</span><input type="number" inputmode="decimal" step="0.5" min="0" value="${x.kg}" placeholder="${u?'—':'kg'}" data-i="setkg" data-e="${i}" data-k="${k}" ${u?'disabled':''} aria-label="Carga série ${k+1}">
    <input type="number" inputmode="numeric" min="0" value="${x.reps}" placeholder="${top||''}" data-i="setreps" data-e="${i}" data-k="${k}" aria-label="Repetições série ${k+1}"><button class="chk" aria-pressed="${x.done}" data-a="setdone" data-e="${i}" data-k="${k}" aria-label="Série ${k+1} feita">${ico('check')}</button></div>`).join('')}
   <div class="row"><button class="btn sm" data-a="addset" data-e="${i}">${ico('plus')}Série</button><button class="btn sm ghost" data-a="rmset" data-e="${i}">${ico('minus')}Série</button><span class="sp"></span><button class="iconbtn del" data-a="rmex" data-e="${i}" aria-label="Remover exercício">${ico('trash')}</button></div></div>`;
}
function newSession(p,d,wid){
  const wk=p.plan.workouts[wid],ph=phaseOf(wk,d);const exs=exsFor(p,wid,d);
  return {id:uid(),date:d,wid,ph,startTs:Date.now(),finished:false,notes:'',dur:null,
    exercises:exs.map(e=>{const lp=lastPerf(p,e.name,d);const dk=lp?lp.ex.sets.filter(x=>x.done&&num(x.kg)!=null).map(x=>num(x.kg)):[];const kg=dk.length?Math.max(...dk):(e.kg===''?'':e.kg);
      return {name:e.name,plan:`${e.sets} × ${e.reps}`,load:e.load,reps:e.reps,unit:e.unit||'',ss:e.ss||'',sets:Array.from({length:e.sets},()=>({kg:e.unit==='s'?'':kg,reps:'',done:false}))}})};
}

A.finish=()=>{const p=P(),s=curSess();if(!setsDone(s)){toast('Marque pelo menos uma série como feita');return}
  const prs=[];for(const e of s.exercises){const dk=e.sets.filter(x=>x.done&&num(x.kg)>0&&e.unit!=='s').map(x=>num(x.kg));if(!dk.length)continue;const mx=Math.max(...dk);

const FB={ready:false,auth:null,fs:null,user:null,busy:false,err:''};
const cfgOk=()=>{const c=window.FIREBASE_CONFIG;return !!(c&&c.apiKey&&c.projectId&&!/COLE_AQUI/i.test(c.apiKey+c.projectId))};
const loadScript=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('falha ao carregar '+src));document.head.appendChild(s)});
async function initSync(){
  if(!cfgOk()){setSync('local','Salvo só neste aparelho');return}
  try{
    const b='https://www.gstatic.com/firebasejs/10.14.1/';
    await loadScript(b+'firebase-app-compat.js');
    await Promise.all([loadScript(b+'firebase-auth-compat.js'),loadScript(b+'firebase-firestore-compat.js')]);
    firebase.initializeApp(window.FIREBASE_CONFIG);
    FB.auth=firebase.auth();FB.fs=firebase.firestore();FB.ready=true;
    FB.auth.onAuthStateChanged(async u=>{FB.user=u;
      if(u){
        const col=FB.fs.collection('users').doc(u.uid).collection('parts');
        SYNC.ref={get:async()=>{const s=await col.get();return {docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}},doc:k=>({set:v=>col.doc(k).set(v)})};
        try{await syncPull()}catch(e){setSync('err',fbMsg(e))}
      }else{SYNC.ref=null;setSync('local','Entre na conta para sincronizar');if(typeof partnerRefresh==='function')partnerRefresh()}
      refreshCloud()});
    addEventListener('online',()=>{if(SYNC.ref)scheduleSync(true)});
  }catch(e){setSync('local','Sem conexão com a nuvem agora');FB.err='Não consegui carregar o Firebase. Verifique a internet.';refreshCloud()}
}
function fbMsg(e){const c=(e&&e.code)||'';return ({
 'auth/invalid-email':'E-mail inválido.','auth/missing-password':'Digite a senha.','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.',
 'auth/email-already-in-use':'Este e-mail já tem conta. Use “Entrar”.','auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.',
 'auth/network-request-failed':'Sem internet. Tente de novo.','auth/too-many-requests':'Muitas tentativas. Espere alguns minutos.',
 'auth/operation-not-allowed':'Ative “E-mail/senha” em Authentication > Sign-in method no console do Firebase.',
 'auth/unauthorized-domain':'Adicione o endereço do seu site em Authentication > Settings > Authorized domains.',
 'permission-denied':'Permissão negada: confira as regras do Firestore (veja o guia).','unavailable':'Nuvem indisponível agora. Seus dados continuam salvos no aparelho.'})[c]||('Erro: '+(c||(e&&e.message)||'desconhecido'))}

/* ========== amigo: ver o perfil do outro (somente leitura, ao vivo) ==========
   Cada pessoa continua gravando só na própria conta (users/<uid>/parts). Para o outro poder LER, a pessoa
   cria um documento users/<uid>/readers/<uid-do-amigo>; a regra do Firestore libera a leitura de "parts"
   só para quem tem esse documento. O "código" que se troca é o uid da conta (não dá para adivinhar). */
const PT={uid:null,parts:{},st:null,p:null,at:0,err:'',unsub:null};
const ptKey=u=>'diariofit.amigo.'+u;
const partnerProfile=()=>PT.p;
function firstName(n){return String(n||'').trim().split(/\s+/)[0].slice(0,8)||'Amigo'}
function partnerTab(){
  return ['par',firstName((PT.p&&PT.p.name)||(S.partner&&S.partner.name)),'users'];
}
function relT(ts){
  if(!ts)return 'sem registros';const m=Math.round((Date.now()-ts)/60000);
  if(m<1)return 'agora';if(m<60)return `há ${m} min`;const h=Math.round(m/60);if(h<24)return `há ${h} h`;const d=Math.round(h/24);return `há ${d} dia${d>1?'s':''}`;
}
function rebuildPT(){
  try{
    const st=fromParts(PT.parts);if(!st){PT.st=PT.p=null;return}
    migrate(st);PT.st=st;PT.p=st.profiles[st.active]||Object.values(st.profiles)[0]||null;PT.at=st.updatedAt||0;
    if(PT.p&&S.partner&&S.partner.name!==PT.p.name){S.partner.name=PT.p.name;save()}
  }catch(e){PT.st=PT.p=null}
}
function partnerLoadCache(){
  if(!S.partner||!S.partner.uid)return;
  try{const raw=localStorage.getItem(ptKey(S.partner.uid));if(raw){PT.uid=S.partner.uid;PT.parts=JSON.parse(raw);rebuildPT()}}catch(e){}
}
function stopPartner(){if(PT.unsub){try{PT.unsub()}catch(e){}}PT.unsub=null}
let paintT=null;
function paint(){
  clearTimeout(paintT);
  paintT=setTimeout(()=>{
    const ae=document.activeElement,typing=!!(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName));
    if(S.ui.tab==='par'){if(!typing)render();return}
    const c=$('#ptcard');if(c)c.outerHTML=partnerCard();
    const has=!!document.querySelector('.tbar [data-t="par"],.tbi [data-t="par"]');
    if(has!==!!partnerTab()&&!typing)render();
  },120);
}
function partnerRefresh(){
  const want=(FB.user&&S.partner&&S.partner.uid)||null;
  if(!want){stopPartner();if(!S.partner){PT.uid=null;PT.parts={};PT.st=PT.p=null;PT.err=''}paint();return}
  if(PT.uid===want&&PT.unsub)return;
  stopPartner();
  if(PT.uid!==want){PT.uid=want;PT.parts={};PT.st=PT.p=null}
  PT.err='';
  try{
    PT.unsub=FB.fs.collection('users').doc(want).collection('parts').onSnapshot(snap=>{
      const parts={};snap.docs.forEach(d=>{const v=d.data();if(v&&typeof v.j==='string')parts[d.id]=v.j});
      if(parts.meta){PT.err='';PT.parts=parts;try{localStorage.setItem(ptKey(want),JSON.stringify(parts))}catch(e){}rebuildPT()}
      else if(!PT.p){PT.err='empty'}
      paint();
    },err=>{
      PT.err=(err&&err.code)==='permission-denied'?'denied':'net';PT.unsub=null;paint();
      setTimeout(()=>{if(PT.uid===want&&!PT.unsub&&FB.user)partnerRefresh()},PT.err==='denied'?15000:30000);
    });
  }catch(e){PT.err='net'}
  paint();
}

/* ----- números para o resumo comparativo ----- */
function pStats(p){
  const d=todayStr(),w=schedOf(p,d),wk=p.plan.workouts[w],sess=sessionOf(p,d),tt=dayTotals(p,d),tg=dayTarget(p,d),dl=getDay(p,d),doses=creDoses(p,d),ent=p.body.find(b=>b.date===d&&b.weight!=null);
  let tN=0,tD=0,dN=0,dD=0,cN=0,cD=0,wN=0;
  for(let i=0;i<7;i++){const x=addDays(d,-i);if(x<p.start||x>p.end)continue;
    const tk=trainOK(p,x);if(schedOf(p,x)!=='R'&&(x<d||tk===true)){tD++;if(tk===true)tN++}
    const dk=dietOK(p,x);if(x<d||dk===true){dD++;if(dk===true)dN++}
    const ck=creOK(p,x);if(ck!==null&&(x<d||ck===true)){cD++;if(ck===true)cN++}
    if(p.body.some(b=>b.date===x&&b.weight!=null))wN++}
  let streak=0;for(let x=d;x>=p.start;x=addDays(x,-1)){if(x>p.end)continue;const tk=trainOK(p,x);if(tk===true)streak++;else if(tk===null)continue;else if(x===d)continue;else break}
  const done=p.sessions.filter(sessDone);
  return {d,w,wk,sess,tt,tg,dl,doses,ent,tN,tD,dN,dD,cN,cD,wN,streak,sessN:done.length,vol:done.reduce((a,s)=>a+setsVol(s),0),bs:bodyStats(p),trained:!!(sess&&sessDone(sess)),creTaken:doses.filter((_,i)=>dl.cre[i]).length};
}
function vPResumo(me,fr){
  const a=pStats(me),b=pStats(fr),nm=fr.name.split(/\s+/)[0];
  const tp=s=>s.w==='R'?'<span class="pill">Descanso</span>':s.trained?'<span class="pill ok">Feito</span>':'<span class="pill warn">Pendente</span>';
  const tw=s=>s.w==='R'?'':`<div class="tiny faint">${s.w} · ${esc(s.wk?s.wk.name:'')}</div>`;
  const row=(l,x,y)=>`<div>${l}</div><div>${x}</div><div>${y}</div>`;
  const table=(rows)=>`<div class="cmpg"><div class="h"></div><div class="h">Você</div><div class="h">${esc(nm)}</div>${rows}</div>`;
  const frac=(n,d)=>d?`<b>${n}</b> / ${d}`:'—';
  const kg=s=>s.bs.lost!=null?(s.bs.lost>=0?'−':'+')+f1(Math.abs(s.bs.lost))+' kg':'—';
  const pc=s=>s.bs.pct!=null?f0(clamp(s.bs.pct*100,-999,999))+'%':'—';
  const hoje=table(
    row('Treino',tp(a)+tw(a),tp(b)+tw(b))+
    row('Refeições feitas',frac(a.tt.done,a.tt.total),frac(b.tt.done,b.tt.total))+
    row('Calorias (kcal)',`<b>${f0(a.tt.kcal)}</b> / ${f0(a.tg.kcal)}`,`<b>${f0(b.tt.kcal)}</b> / ${f0(b.tg.kcal)}`)+
    row('Água',`<b>${f1((a.dl.water||0)/1000,2)}</b> L`,`<b>${f1((b.dl.water||0)/1000,2)}</b> L`)+
    row('Creatina (doses)',a.doses.length?frac(a.creTaken,a.doses.length):'—',b.doses.length?frac(b.creTaken,b.doses.length):'—')+
    row('Peso de hoje',a.ent?f1(a.ent.weight)+' kg':'—',b.ent?f1(b.ent.weight)+' kg':'—'));
  const sem=table(
    row('Treinos feitos',frac(a.tN,a.tD),frac(b.tN,b.tD))+
    row('Dias de dieta ✔',frac(a.dN,a.dD),frac(b.dN,b.dD))+
    row('Dias de creatina ✔',frac(a.cN,a.cD),frac(b.cN,b.cD))+
    row('Pesagens',`<b>${a.wN}</b>`,`<b>${b.wN}</b>`)+
    row('Sequência de treinos',`<b>${a.streak}</b>`,`<b>${b.streak}</b>`));
  const tot=table(
    row('Treinos feitos',`<b>${a.sessN}</b>`,`<b>${b.sessN}</b>`)+
    row('Volume total',`<b>${f1(a.vol/1000)}</b> t`,`<b>${f1(b.vol/1000)}</b> t`)+
    row('Peso perdido',kg(a),kg(b))+
    row('Da meta mínima',pc(a),pc(b))+
    row('Cintura',a.bs.waistLast!=null?f1(a.bs.waistLast)+' cm':'—',b.bs.waistLast!=null?f1(b.bs.waistLast)+' cm':'—'));
  const lossSer=(p,name,color)=>{const w=weightsOf(p);if(!w.length)return {name,color,pts:[]};const base=w[0].weight;return {name,color,pts:w.map(x=>({x:diffDays(x.date,me.start),y:base-x.weight}))}};
  const ser=[lossSer(me,'Você','var(--brand)'),lossSer(fr,nm,'var(--lo)')];
  const x1=Math.max(diffDays(me.end,me.start),...ser.flatMap(s=>s.pts.map(q=>q.x)),1);
  const chart=chartLine('pcmp',{series:ser,epoch:me.start,x0:0,x1,h:210,today:diffDays(todayStr(),me.start),label:'Peso perdido desde a primeira pesagem',yfmt:v=>f1(v)+' kg'});
  const msgs=[];
  if(b.w!=='R'&&!b.trained)msgs.push(['Cobrar treino',`E aí, ${nm}! Hoje é treino ${b.w}${b.wk?' ('+b.wk.name+')':''}. Já foi?`]);
  if(b.tt.done<b.tt.total)msgs.push(['Cobrar dieta',`${nm}, como está a dieta hoje? Já registrou as refeições no app?`]);
  if(b.trained)msgs.push(['Dar os parabéns',`Boa, ${nm}! Vi que você treinou hoje. Segue assim!`]);
  const wa=(l,t)=>`<a class="btn" href="https://wa.me/?text=${encodeURIComponent(t)}" target="_blank" rel="noopener">${esc(l)}</a>`;
  return `<div class="stack">
   <div class="card"><div class="ch"><h3>Hoje</h3><span class="small muted">${WD[dow(a.d)]} ${fmtD(a.d)}</span></div>${hoje}</div>
   <div class="card"><div class="ch"><h3>Últimos 7 dias</h3></div>${sem}<p class="tiny faint" style="margin-top:8px">O dia de hoje só entra na conta depois de cumprido.</p></div>
   <div class="card"><div class="ch"><h3>Desde o início</h3></div>${tot}</div>
   <div class="card"><div class="ch"><h3>Perda de peso</h3></div>${chart}</div>
   <div class="card"><div class="ch"><h3>Cobrar ${esc(nm)}</h3></div><p class="small muted" style="margin-bottom:10px">Abre o WhatsApp com a mensagem pronta; você escolhe a conversa e envia.</p><div class="row" style="flex-wrap:wrap">${msgs.map(m=>wa(m[0],m[1])).join('')||'<span class="small muted">Nada para cobrar agora.</span>'}</div></div></div>`;
}

/* ----- aba do amigo ----- */
function vPar(){
  if(!cfgOk())return `<div class="card"><p class="muted">A nuvem ainda não foi configurada neste app: o arquivo <b>firebase-config.js</b> ainda tem COLE_AQUI.</p></div>`;
  if(!S.partner)return `<div class="stack"><div class="note"><b>Veja o progresso do seu amigo e deixe ele ver o seu.</b> Cada um edita só o seu perfil; o outro só consegue olhar. ${FB.user?'Troquem os códigos abaixo.':'Primeiro entre na sua conta.'}</div>${partnerCard()}</div>`;
  if(!PT.p)return `<div class="stack">${partnerCard()}</div>`;
  const me=S.profiles[S.active],p=PT.p,cur=S.ui.psec||'resumo';
  const secs=[['resumo','Resumo'],['hoje','Hoje'],['dieta','Dieta'],['treino','Treino'],['corpo','Corpo'],['cal','Calendário']];
  const bar=`<div class="pbar"><span class="av">${esc((p.name||'?').trim().charAt(0).toUpperCase())}</span><div class="sp" style="min-width:0"><b>${esc(p.name)}</b><div class="small muted">Somente leitura · última atividade ${relT(PT.at)}${PT.err==='net'?' · sem conexão, mostrando o último que recebi':PT.err==='denied'?' · acesso removido, mostrando o último que recebi':''}</div></div><button class="btn sm" data-a="pgoset">Conexão</button></div>`;
  const tabs=`<div class="tabs" role="tablist" style="margin-top:12px">${secs.map(([k,l])=>`<button role="tab" aria-selected="${cur===k}" data-a="psec" data-s="${k}">${l}</button>`).join('')}</div>`;
  let inner='';RO=p;
  try{
    switch(cur){
      case 'hoje':inner=vHoje();break;
      case 'dieta':if(sub('dieta','dia')==='alimentos')S.ui.sub.dieta='dia';inner=vDieta();break;
      case 'treino':inner=vTreino();break;
      case 'corpo':inner=vMedidas();break;
      case 'cal':inner=vCal();break;
      default:inner=vPResumo(me,p);
    }
  }catch(e){console.error(e);inner=`<div class="note warn">Não consegui montar esta tela com os dados do seu amigo.</div>`}
  finally{RO=null}
  return bar+tabs+`<div class="rocontent">${inner}</div>`;
}

/* ========== CALENDÁRIO ========== */
function vCal(){
  const p=P(),n=planDays(p),today=todayStr(),sel=D();
  const lead=dow(p.start);const cells=[];for(let i=0;i<lead;i++)cells.push(null);for(let i=0;i<n;i++)cells.push(addDays(p.start,i));
  const dot=(v,past,cls='')=>`<span class="dot ${cls} ${v===true?'on':v===false&&past?'no':''}"></span>`;
  let cntD=0,cntT=0,cntC=0,cntW=0,prevT=0,prevC=0,pastN=0,pastD=0,pastT=0,pastPrev=0;
  for(let i=0;i<n;i++){const d=addDays(p.start,i);const past=d<=today;const w=schedOf(p,d)!=='R';const dok=dietOK(p,d),tok=trainOK(p,d),cok=creOK(p,d);
    if(dok===true)cntD++;if(tok===true)cntT++;if(cok===true)cntC++;if(w)prevT++;if(creDoses(p,d).length)prevC++;if(p.body.some(b=>b.date===d&&b.weight!=null))cntW++;
    if(past){pastN++;if(dok===true)pastD++;if(w){pastPrev++;if(tok===true)pastT++}}}
  let streak=0;for(let d=today<p.start?null:(today>p.end?p.end:today);d&&d>=p.start;d=addDays(d,-1)){const ok=dietOK(p,d);if(ok===true)streak++;else if(d===today&&ok==null)continue;else break}
  const pct=(a,b)=>b?f0(a/b*100)+'%':'—';
  const cell=d=>{if(!d)return '<div></div>';const hi=isHigh(p,d),w=schedOf(p,d),past=d<=today,ev=p.plan.events[d];const wb=p.body.some(b=>b.date===d&&b.weight!=null);
    return `<button class="cd ${hi?'hi':'lo'} ${d===today?'today':''} ${d===sel?'sel':''}" data-a="goday" data-d="${d}" data-t="hoje" title="${esc(WDL[dow(d)]+' '+fmtD(d)+' · carbo '+(hi?'alto':'baixo')+(ev?' · '+ev:''))}" aria-label="${esc(WDL[dow(d)]+' '+fmtD(d))}">
      ${ev?'<span class="ev"></span>':''}<span class="n num">${pdate(d).getDate()}</span><span class="t">${w==='R'?'Descanso':'Treino '+w}</span>
      <span class="dots">${dot(dietOK(p,d),past)}${w!=='R'?dot(trainOK(p,d),past):''}${creDoses(p,d).length?dot(creOK(p,d),past,'c'):''}${wb?'<span class="dot w on"></span>':''}</span></button>`};
  const events=Object.entries(p.plan.events).sort();
  return `<div class="stack"><div class="card"><div class="ch"><h3>${fmtD(p.start)} a ${fmtD(p.end)} · ${n} dias</h3></div>
   <div class="cal">${WD.map(w=>`<div class="h">${w}</div>`).join('')}${cells.map(cell).join('')}</div>
   <div class="legend" style="margin-top:12px"><span><i class="sw" style="background:var(--hi)"></i>Carbo alto</span><span><i class="sw" style="background:var(--lo)"></i>Carbo baixo</span><span><span class="dot on"></span>Dieta/treino ✔</span><span><span class="dot no"></span>Faltou</span><span><span class="dot c on"></span>Creatina</span><span><span class="dot w on"></span>Pesagem</span><span><i class="sw" style="background:var(--brand);transform:rotate(45deg);width:8px;height:8px"></i>Marco</span></div></div>
   <div class="tiles"><div class="tile"><span class="upper">Dieta ✔</span><span class="v">${cntD}<small> / ${n}</small></span><span class="small muted">${pct(pastD,pastN)} dos dias até hoje</span></div>
    <div class="tile"><span class="upper">Treinos ✔</span><span class="v">${cntT}<small> / ${prevT}</small></span><span class="small muted">${pct(pastT,pastPrev)} dos previstos até hoje</span></div>
    <div class="tile"><span class="upper">Creatina ✔</span><span class="v">${cntC}<small> / ${prevC}</small></span><span class="small muted">dias com todas as doses</span></div>
    <div class="tile"><span class="upper">Pesagens</span><span class="v">${cntW}<small> / ${Math.floor((n-1)/7)+1}</small></span><span class="small muted">sequência de dieta: ${streak} dia${streak===1?'':'s'}</span></div></div>
   <div class="card"><div class="ch"><h3>Marcos do plano</h3></div><div class="stack" style="gap:6px">${events.map(([d,t])=>`<div class="row"><span class="pill ${d<=today?'':'brand'}">${fmtD(d)}</span><span class="sp small">${esc(t)}</span><button class="iconbtn del" data-a="evdel" data-d="${d}" aria-label="Remover marco">${ico('x')}</button></div>`).join('')}
    <div class="row" style="margin-top:6px"><input type="date" id="ev_d" value="${sel}" style="max-width:160px"><input type="text" id="ev_t" placeholder="Novo marco (ex.: consulta, avaliação)" style="flex:1;min-width:160px"><button class="btn" data-a="evadd">${ico('plus')}Adicionar</button></div></div></div></div>`;
}
A.evadd=()=>{const d=$('#ev_d').value,t=$('#ev_t').value.trim();if(!d||!t){toast('Informe a data e o texto do marco');return}const ev=P().plan.events;ev[d]=ev[d]?ev[d]+' · '+t:t;save();render()};

function vMais(){

function vCre(){
  const p=P(),c=p.plan.creatine,tt=creTotals(p),np=Object.keys(S.profiles).length,today=todayStr();
  const rows=[];let acc=0;for(let i=0;i<tt.days;i++){const d=addDays(c.start,i);const ds=creDoses(p,d);const g=ds.reduce((a,x)=>a+x.g,0);acc+=g;const dl=getDay(p,d);const taken=ds.filter((_,k)=>dl.cre[k]).length;
    rows.push(`<tr class="${d===today?'sel':''}"><td>${i+1}</td><td><button class="btn sm ghost" data-a="goday" data-d="${d}" data-t="hoje">${WD[dow(d)]} ${fmtD(d)}</button></td><td>${ds[0]?ds[0].phase:''}</td><td>${f0(g)} g</td><td class="wrap">${ds.map(x=>x.t).join(' · ')}</td><td>${taken}/${ds.length} ${taken===ds.length&&ds.length?'<span class="pos">✔</span>':''}</td><td>${f0(acc)} g</td></tr>`)}
  return `<div class="stack"><div class="tiles"><div class="tile"><span class="upper">Saturação</span><span class="v">${f0(tt.satG)}<small> g</small></span><span class="small muted">${c.satDose} g/dia por ${tt.sat} dias (${c.satPerDay} × ${c.satDose/c.satPerDay} g)</span></div>
   <div class="tile"><span class="upper">Manutenção</span><span class="v">${f0(tt.manG)}<small> g</small></span><span class="small muted">${c.maintDose} g/dia por ${tt.man} dias</span></div>
   <div class="tile"><span class="upper">Total por pessoa</span><span class="v">${f0(tt.total)}<small> g</small></span></div>
   <div class="tile"><span class="upper">Potes de ${c.pot} g</span><span class="v">${Math.ceil(tt.total*np/c.pot)}</span><span class="small muted">para ${np} pessoa${np>1?'s':''} (${f0(tt.total*np)} g); um pote só não chega, compre com folga</span></div></div>
  <details class="acc"><summary>Parâmetros do protocolo</summary><div class="accb"><div class="fields">
   ${[['start','Início','date'],['end','Fim','date'],['satDose','Dose na saturação (g/dia)','number'],['satPerDay','Doses por dia na saturação','number'],['satDays','Dias de saturação','number'],['maintDose','Dose de manutenção (g/dia)','number'],['pot','Tamanho do pote (g)','number']].map(([k,l,ty])=>`<label class="f">${l}<input type="${ty}" value="${c[k]}" data-c="crep" data-k="${k}"></label>`).join('')}</div>
   <p class="small muted">Tome dissolvida, com uma refeição. Ela retém 1–2 kg de água: acompanhe pela cintura.</p></div></details>
  <div class="card"><div class="ch"><h3>Dia a dia</h3></div><div class="tbl-wrap" style="max-height:520px"><table class="tbl"><thead><tr><th>Dia</th><th>Data</th><th>Fase</th><th>Dose</th><th>Horários</th><th>Tomadas</th><th>Acumulado</th></tr></thead><tbody>${rows.join('')}</tbody></table></div></div></div>`;
}
I.crep=el=>{const c=P().plan.creatine,k=el.dataset.k;if(el.type==='date'){if(el.value)c[k]=el.value}else{const v=num(el.value);if(v==null||v<=0)return;c[k]=k==='satPerDay'||k==='satDays'?Math.round(v):v}save();render()};

  p.sessions.filter(sessDone).forEach(s=>L.push({d:s.date,k:'treino',h:`<b>Treino ${s.wid} — ${esc((p.plan.workouts[s.wid]||{}).name||'')}</b><div class="small muted">${setsDone(s)} séries · ${f0(setsVol(s))} kg de volume${s.dur?' · '+s.dur+' min':''}${s.notes?'<br>“'+esc(s.notes)+'”':''}</div>`,go:'treino',del:'sess:'+s.id}));
  p.body.forEach(b=>L.push({d:b.date,k:'medida',h:`<b>Medidas</b><div class="small muted">${[b.weight!=null?f1(b.weight)+' kg':'',...MEAS.filter(m=>b[m[0]]!=null).map(m=>m[1]+' '+f1(b[m[0]])+' '+m[2])].filter(Boolean).join(' · ')}${b.note?'<br>“'+esc(b.note)+'”':''}</div>`,go:'corpo',del:'body:'+b.id}));
  Object.entries(p.days).forEach(([d,dl])=>{const t=dayTotals(p,d);if(t.logged||t.extraKcal||dl.water)L.push({d,k:'dieta',h:`<b>Dieta e hábitos</b><div class="small muted">${f0(t.kcal)} kcal de ${f0(dayTarget(p,d).kcal)} · P ${f0(t.p)} g · ${t.done}/${t.total} refeições${dl.water?' · '+f1(dl.water/1000,1)+' L de água':''}</div>`,go:'dieta',del:'day:'+d});

  const F=L.filter(x=>f==='tudo'||x.k===f).sort((a,b)=>b.d.localeCompare(a.d)||a.k.localeCompare(b.k));const lim=S.ui.histN||60;

    <div class="row" style="gap:0;flex-wrap:nowrap"><button class="iconbtn" data-a="goday" data-d="${x.d}" data-t="${x.go}" aria-label="Abrir">${ico('right')}</button>${x.del?`<button class="iconbtn del" data-a="histdel" data-x="${x.del}" aria-label="Excluir">${ico('trash')}</button>`:''}</div></div></div>`).join(''):'<div class="empty">Nada registrado ainda. Seus treinos, medidas, refeições e anotações aparecem aqui.</div>'}
   ${F.length>lim?`<button class="btn" data-a="histmore">Mostrar mais</button>`:''}</div>`;
}
A.histf=el=>{S.ui.sub.hist=el.dataset.f;S.ui.histN=60;save();render()};A.histmore=()=>{S.ui.histN=(S.ui.histN||60)+60;render()};
A.histdel=el=>{const [k,id]=el.dataset.x.split(':');ask('Excluir este registro? Isso não pode ser desfeito.',()=>{const p=P();
  if(k==='sess')p.sessions=p.sessions.filter(s=>s.id!==id);else if(k==='body')p.body=p.body.filter(b=>b.id!==id);else if(k==='day'&&p.days[id]){const dl=p.days[id];dl.meals={};dl.extras=[];dl.water=0;dl.wlog=[];dl.over=null}

I.calc=()=>{
  const sex=$('#c_sex')?.value,age=num($('#c_age')?.value),w=num($('#c_w')?.value),h=num($('#c_h')?.value),f=num($('#c_f')?.value),k=num($('#c_k')?.value);
  const o1=$('#c_out1');if(o1){if([age,w,h,f].every(v=>v!=null)){const tmb=10*w+6.25*h-5*age+(sex==='F'?-161:5),td=tmb*f,def=k!=null?td-k:null,bmi=w/((h/100)**2);

  const kg=num($('#r_k')?.value),r=num($('#r_r')?.value),o2=$('#c_out2');if(o2)o2.innerHTML=kg&&r?`<div class="tile"><span class="upper">1RM</span><span class="v">${f1(kg*(1+r/30))}<small> kg</small></span></div><div class="tile"><span class="upper">85% (≈ 6 reps)</span><span class="v">${f1(kg*(1+r/30)*.85)}<small> kg</small></span></div><div class="tile"><span class="upper">70% (≈ 12 reps)</span><span class="v">${f1(kg*(1+r/30)*.7)}<small> kg</small></span></div>`:'<span class="muted small">Informe carga e repetições.</span>';
  const np=num($('#n_p')?.value),nc=num($('#n_c')?.value),nq=num($('#n_q')?.value),o3=$('#c_out3');

    o3.innerHTML=bf!=null&&isFinite(bf)?`<div class="tile"><span class="upper">Gordura</span><span class="v">${f1(bf)}<small> %</small></span></div>${w?`<div class="tile"><span class="upper">Massa magra</span><span class="v">${f1(w*(1-bf/100))}<small> kg</small></span></div>`:''}`:'<span class="muted small">Valores incompatíveis.</span>'}else o3.innerHTML='<span class="muted small">Informe pescoço e cintura'+(sex==='F'?' e quadril':'')+'.</span>'}
};

  ${typeof cloudCard==='function'?cloudCard():''}${typeof partnerCard==='function'?partnerCard():''}
  <div class="card"><div class="ch"><h3>Backup e dados</h3></div>
   <p class="small muted" style="margin-bottom:10px">${SYNC.state==='on'?'Seus dados também estão guardados na nuvem da sua conta, por pessoa e por mês.':'Seus dados ficam neste navegador. Se limpar os dados do site ou trocar de aparelho, eles somem: exporte um backup de vez em quando.'}${memOnly?' <b>O armazenamento local está bloqueado neste contexto: os dados valem só até fechar a página.</b>':''}</p>
   <div class="row"><button class="btn pri" data-a="exportjson">${ico('down')}Exportar backup (JSON)</button><button class="btn" data-a="importmodal">${ico('up')}Importar backup</button></div>
   <div class="row" style="margin-top:10px"><button class="btn sm" data-a="csv" data-k="body">CSV de medidas</button><button class="btn sm" data-a="csv" data-k="diet">CSV de dieta</button><button class="btn sm" data-a="csv" data-k="train">CSV de treinos</button></div>
   <hr class="sep"><div class="row"><button class="btn danger sm" data-a="clearlogs">Apagar registros de ${esc(p.name)}</button><button class="btn danger sm" data-a="resetall">Restaurar tudo ao original</button></div></div></div>`;
}
I.pf=el=>{const p=P(),k=el.dataset.k;if(['age','height','startWeight','goalMin','goalMax'].includes(k)){const v=num(el.value);if(v==null||v<=0){toast('Valor inválido');render();return}p[k]=k==='age'?Math.round(v):v}
  else if(k==='start'||k==='end'){if(!el.value)return;p[k]=el.value;if(p.end<p.start){toast('O fim deve ser depois do início');p[k]=k==='start'?p.end:p.start}}
  else p[k]=el.value.trim()||p[k];save();render()};
I.pfw=el=>{const v=num(el.value);if(v&&v>0)P().plan.water[el.dataset.k]=v;save()};
A.hitoggle=el=>{const p=P(),i=+el.dataset.i,L=p.plan.carbHigh;p.plan.carbHigh=L.includes(i)?L.filter(x=>x!==i):L.concat(i).sort();save();render()};
I.sched=el=>{P().plan.sched[+el.dataset.i]=el.value;save()};
A.delprof=()=>ask(`Excluir ${P().name} e todos os registros? Isso não pode ser desfeito.`,()=>{delete photos[P().id];savePhotos();delete S.profiles[S.active];S.active=Object.keys(S.profiles)[0];save();render()},'Excluir');
A.clearlogs=()=>ask('Apagar todos os registros de dieta, treinos e medidas desta pessoa? O plano é mantido.',()=>{const p=P();p.days={};p.sessions=[];p.body=[{id:uid(),date:p.start,weight:p.startWeight,note:'Peso inicial'}];save();render();toast('Registros apagados')},'Apagar');
A.resetall=()=>ask('Restaurar o app ao estado original? Todos os registros e edições de todas as pessoas serão apagados.',()=>{const ui=S.ui;S=freshState();S.onboarded=true;S.ui=ui;photos={};savePhotos();save();render();toast('Restaurado')},'Restaurar tudo');

async function exportFile(name,text,mime){
  if(!window.claude){try{const bl=new Blob([text],{type:mime||'text/plain;charset=utf-8'});const u=URL.createObjectURL(bl);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Download iniciado: '+name);return}catch(e){}}
  try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:text});toast('Arquivo salvo');return}}catch(e){if(e&&e.code==='declined')return}
  openModal(`<h3>${esc(name)}</h3><p class="small muted">O download direto não está disponível aqui. Copie o texto abaixo e cole num arquivo ${esc(name)}.</p><textarea id="expt" rows="10" readonly style="font-family:ui-monospace,monospace;font-size:12px">${esc(text)}</textarea><div class="mfoot"><button class="btn" data-a="close">Fechar</button><button class="btn pri" data-a="copyexp">${ico('copy')}Copiar</button></div>`,true);
}
A.copyexp=async()=>{const t=$('#expt');t.select();try{await navigator.clipboard.writeText(t.value);toast('Copiado')}catch(e){try{document.execCommand('copy');toast('Copiado')}catch(_){toast('Selecione o texto e copie')}}};
A.exportjson=()=>exportFile(`diario-fit-backup-${todayStr()}.json`,JSON.stringify({app:'diario-fit',exportedAt:new Date().toISOString(),state:S},null,1));
A.importmodal=()=>openModal(`<h3>Importar backup</h3><p class="small muted">Substitui todos os dados atuais pelos do arquivo.</p><label class="f">Arquivo .json<input type="file" accept=".json,application/json" id="imp_f" data-c="impfile"></label><label class="f">ou cole o conteúdo<textarea id="imp_t" rows="5"></textarea></label><div class="mfoot"><button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="impok">Importar</button></div>`);
I.impfile=el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#imp_t').value=r.result};r.readAsText(f)};
A.impok=()=>{try{const o=JSON.parse($('#imp_t').value);const st=o.state||o;if(!st.profiles||!Object.keys(st.profiles).length)throw 0;
  const ui=S.ui;S=st;S.ui=S.ui||ui;S.foods=S.foods||[];if(!S.profiles[S.active])S.active=Object.keys(S.profiles)[0];S.onboarded=true;save();SYNC.last={};closeModal();render();toast('Backup importado')}catch(e){toast('Arquivo inválido: não parece um backup do Diário Fit')}};
A.csv=el=>{const p=P(),k=el.dataset.k,q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';let rows=[];
  if(k==='body'){rows.push(['data','peso_kg',...MEAS.map(m=>m[1]),'obs']);bodySorted(p).forEach(b=>rows.push([b.date,b.weight,...MEAS.map(m=>b[m[0]]),b.note]))}
  else if(k==='diet'){rows.push(['data','tipo','kcal','meta_kcal','proteina_g','carbo_g','gordura_g','refeicoes','agua_ml']);Object.keys(p.days).sort().forEach(d=>{const t=dayTotals(p,d);if(!t.logged&&!t.water&&!t.extraKcal)return;rows.push([d,isHigh(p,d)?'alto':'baixo',Math.round(t.kcal),dayTarget(p,d).kcal,Math.round(t.p),Math.round(t.c),Math.round(t.f),t.done,t.water])})}
  else{rows.push(['data','treino','exercicio','serie','kg','reps_ou_s','feita']);p.sessions.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>s.exercises.forEach(e=>e.sets.forEach((x,i)=>rows.push([s.date,s.wid,e.name,i+1,x.kg,x.reps,x.done?'sim':'não']))))}
  if(rows.length<2){toast('Ainda não há dados para exportar');return}
  exportFile(`diario-fit-${k}-${todayStr()}.csv`,'﻿'+rows.map(r=>r.map(q).join(';')).join('\n'))};

/* ========== inicialização ========== */
let rzT=null;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(drawCharts,150)});
loadState();if(typeof partnerLoadCache==='function')partnerLoadCache();
{const h=(location.hash||'').slice(1);if(TABKEYS.includes(h))S.ui.tab=h;try{history.replaceState({t:S.ui.tab},'','#'+S.ui.tab)}catch(e){}}
document.body.insertAdjacentHTML('beforeend','<div id="toast" aria-live="polite"></div><div id="rest" hidden></div>');
render();
if(!S.onboarded)onboarding();
initSync();

</script></body></html>
