  return `<div class="card"><div class="ch"><h3>Quem está onde</h3><span class="small muted">Panorama Bíblico</span></div><div class="stack" style="gap:14px">${L.map(row).join('')}</div></div>`;
}

/* ----- cartão do dia (aba Leitura e tela Hoje) ----- */
function readCard(p,d,full){
  const row=rdRow(d),tot=rdTotal(p),pg=rdPage(p),isT=d===todayStr(),td=rdReadOn(p,d);
  const head=(pill)=>`<div class="ch"><h3>Leitura</h3>${pill}</div>`;
  const btns=(a)=>`<div class="seg" style="margin-top:10px">${[[-5,'−5'],[-1,'−1'],[1,'+1'],[5,'+5'],[10,'+10']].map(([n,l])=>`<button data-a="rdadd" data-n="${n}" data-d="${d}" aria-label="${n>0?'Somar':'Tirar'} ${Math.abs(n)} página${Math.abs(n)>1?'s':''}">${l}</button>`).join('')}</div>`;
  const b=isT?rdBadge(p):null,pill=b?`<span class="pill ${b[0]}">${esc(b[1])}</span>`:'';
  const ro=typeof RO!=='undefined'&&!!RO,you=ro?esc(firstName(p.name)):'Você',inside=d>=RD_START&&d<=RD_END;
  let h;
  if(!row&&inside){
    h=`${head(pill)}<p><b>Sem leitura nova neste dia.</b></p><p class="small muted">A leitura de ${fmtD(RD_START)} reuniu as páginas de 9, 10 e 11/nov. ${tot<rdCumAt(d)?'Quem ainda não terminou aproveita para recuperar; ':''}se leu mais, é só registrar.</p>
      <div class="big" style="margin:8px 0 0">${td}<small> ${td===1?'pág. lida':'págs lidas'} ${isT?'hoje':'neste dia'}</small></div>${btns()}${isT&&rdCumAt(d)-tot>0?`<div class="row" style="margin-top:10px"><button class="btn pri" data-a="rdall" data-d="${d}">${ico('check')}Li tudo até a meta (${rdN(rdCumAt(d)-tot)})</button></div>`:''}`;
  }else if(!row){
    const before=d<RD_START;
    h=`${head(pill)}<p class="muted">${before?`O plano de leitura começa na ${WDL[dow(RD_START)].toLowerCase()}, ${fmtD(RD_START)}.`:`O plano terminou em ${fmtD(RD_END)}.`} Se leu algo hoje, pode registrar mesmo assim:</p><div class="big">${td}<small> págs hoje</small></div>${btns()}`;
  }else if(row.rev){
    const ok=rdRevOn(p,d);
    h=`${head(pill)}<p><b>Revisão de domingo</b> · ${rdPg(row.pg)}</p><p class="small muted">${esc(row.t)}</p>
      <div class="row" style="margin-top:10px"><button class="btn ${ok?'':'pri'}" data-a="rdrev" data-d="${d}" aria-pressed="${ok}">${ico('check')}${ok?'Revisão feita (desfazer)':'Marcar revisão feita'}</button></div>
      <hr class="sep"><div class="small muted">Leitura pendente? Some as páginas lidas hoje:</div><div class="row" style="margin-top:6px"><div class="big" style="margin:0">${td}<small> págs hoje</small></div></div>${btns()}${isT&&rdCumAt(d)-tot>0?`<div class="row" style="margin-top:10px"><button class="btn pri" data-a="rdall" data-d="${d}">${ico('check')}Li tudo até a meta (${rdN(rdCumAt(d)-tot)})</button></div>`:''}`;
  }else{
    const need=isT?Math.max(0,rdCumAt(d)-tot):0;
    const pc=row.n?clamp((tot-row.a)/row.n*100,0,100):100;
    h=`${head(pill)}<p><b>${rdPg(row.pg)}</b> <span class="muted">· meta do dia: ${rdN(row.n)}</span></p><p class="small muted">${esc(row.t)}</p>
      <div class="row" style="margin-top:8px;align-items:flex-end"><div class="big" style="margin:0">${td}<small> ${td===1?'pág. lida':'págs lidas'} ${isT?'hoje':'neste dia'}</small></div>${td>row.n?`<span class="pill ok">+${td-row.n} além da meta</span>`:''}</div>
      <div class="bar" style="margin:10px 0 0"><i style="width:${pc}%"></i></div>
      ${btns()}
      ${isT&&need>0?`<div class="row" style="margin-top:10px"><button class="btn pri" data-a="rdall" data-d="${d}">${ico('check')}Li tudo até a meta (${rdN(need)})</button></div>`:''}`;
  }
  h+=`<p class="small muted" style="margin-top:10px">${pg==null?`Total: nenhuma página lida ainda. O plano começa na pág. ${RD_SEQ[0]}.`:`${you} está na pág. <b>${pg}</b> · ${tot} de ${RD_TOTAL} págs${tot<RD_TOTAL?` · próxima: pág. ${RD_SEQ[tot]}`:''}.`}</p>`;
  if(full&&!ro){
    h+=`<hr class="sep"><div class="row"><label class="f" style="flex-direction:row;align-items:center;gap:8px"><span class="small">Estou na pág.</span><input type="number" inputmode="numeric" id="rdp" min="1" max="${RD_SEQ[RD_TOTAL-1]}" style="width:96px" placeholder="${pg||RD_SEQ[0]}"></label><button class="btn" data-a="rdgo">Ir para essa página</button></div>
      <p class="tiny faint" style="margin-top:6px">Atalho: em vez de somar, diga em que página você parou. O app ajusta o total de hoje.</p>`;
  }
  return `<div class="card" id="rdcard_${full?'t':'h'}">${h}</div>`;
}

/* ----- aba Leitura ----- */
function vLeit(){
  const p=P(),today=todayStr(),tot=rdTotal(p),gap=rdGap(p,today);
  const days=Math.max(1,Math.min(diffDays(today,RD_START),diffDays(RD_END,RD_START))+1);
  const avg=today<RD_START?0:tot/days;
  const nxt=RD_ROWS.filter(r=>r.d>today).slice(0,3);
  const status=r=>{
    if(r.rev)return rdRevOn(p,r.d)?'<span class="pill ok">✔</span>':r.d<today?'<span class="pill">—</span>':'';
    if(tot>=r.b)return '<span class="pill ok">✔</span>';
    if(tot>r.a)return `<span class="pill warn">${tot-r.a}/${r.n}</span>`;
    return r.d<today?'<span class="pill bad">pendente</span>':'';
  };
  const trow=r=>`<div style="display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-top:1px solid var(--line);${r.d===today?'background:var(--brand-soft);':r.rev?'background:var(--lo-soft);':''}"><div style="flex:none;width:66px;font-size:13px"><b>${WD[dow(r.d)]}</b><div class="muted">${fmtD(r.d)}</div></div><div class="sp small" style="min-width:0"><b>${rdPg(r.pg)}</b>${r.rev?'':` <span class="muted">(${rdN(r.n)})</span>`}<div class="muted">${r.rev?'<i>':''}${esc(r.t)}${r.rev?'</i>':''}</div></div><div style="flex:none;min-width:34px;text-align:right">${status(r)}</div></div>`;
  return `<div class="stack">${readWho()}${readCard(p,today,true)}
   <div class="tiles"><div class="tile"><span class="upper">Páginas lidas</span><span class="v">${tot}<small> / ${RD_TOTAL}</small></span><span class="small muted">${f0(tot/RD_TOTAL*100)}% do plano</span></div>
    <div class="tile"><span class="upper">Meta até hoje</span><span class="v">${rdCumAt(today)}<small> págs</small></span><span class="small muted">${gap>0?`faltam ${rdN(gap)}`:gap<0?`${rdN(-gap)} à frente`:'em dia'}</span></div>
    <div class="tile"><span class="upper">Média por dia</span><span class="v">${f1(avg)}<small> págs</small></span><span class="small muted">últimos 7 dias: ${rdWeek(p)}</span></div></div>
   ${nxt.length?`<div class="card"><div class="ch"><h3>Próximos dias</h3></div><div class="stack" style="gap:8px">${nxt.map(r=>`<div class="row" style="align-items:flex-start"><span class="pill ${r.rev?'brand':''}" style="flex:none">${WD[dow(r.d)]} ${fmtD(r.d)}</span><div class="sp small" style="min-width:0"><b>${rdPg(r.pg)}</b>${r.rev?'':` <span class="muted">(${rdN(r.n)})</span>`}<div class="muted">${esc(r.t)}</div></div></div>`).join('')}</div></div>`:''}
   <details class="acc"><summary style="font-size:17px;padding:10px 14px">Plano completo · ${RD_ROWS.length} dias <span class="small muted">(revisões feitas: ${RD_ROWS.filter(r=>r.rev&&rdRevOn(p,r.d)).length}/${RD_ROWS.filter(r=>r.rev).length})</span></summary><div class="accb"><div>${RD_ROWS.map(trow).join('')}</div>
    <p class="tiny faint" style="margin-top:8px">Linhas azuis são revisões de domingo (não contam páginas). Se atrasar, é só recuperar depois: o total anda pela ordem do plano e a meta de hoje mostra quanto falta. Segunda, 9/nov, reúne as páginas de 9, 10 e 11/nov.</p></div></details></div>`;
}
function rdDone(msg){render();if(msg)toast(msg)}
A.rdadd=el=>{const p=P(),d=el.dataset.d||todayStr(),n=+el.dataset.n;
  if(d>todayStr()){toast('Só dá para registrar hoje ou dias que já passaram');return}
  const r=rdAdjust(p,d,n);if(!r){toast(n>0?'Você já chegou ao fim do plano':'Não há páginas registradas para tirar');return}
  save();rdDone()};
A.rdall=el=>{const p=P(),d=el.dataset.d||todayStr(),need=rdCumAt(d)-rdTotal(p);
  if(need<=0){toast('Você já está em dia');return}rdAdjust(p,d,need);save();rdDone('Meta de hoje cumprida')};
A.rdrev=el=>{const p=P(),d=el.dataset.d||todayStr();if(d>todayStr()){toast('Só dá para marcar hoje ou dias que já passaram');return}
  const dl=ensureDay(p,d);dl.rev=!dl.rev;save();rdDone(dl.rev?'Revisão registrada':'Registro desfeito')};
A.rdgo=()=>{const p=P(),v=Math.round(num($('#rdp').value)),cur=rdTotal(p),d=todayStr();
  if(!v||v<1){toast('Informe a página em que você está');return}
  let target;const at=[];RD_SEQ.forEach((x,i)=>{if(x===v)at.push(i+1)});
  if(at.length)target=at.reduce((a,b)=>Math.abs(b-cur)<Math.abs(a-cur)||(Math.abs(b-cur)===Math.abs(a-cur)&&b>a)?b:a);
  else if(v<RD_SEQ[0])target=0;else if(v>RD_SEQ[RD_TOTAL-1])target=RD_TOTAL;
  else{toast(`A pág. ${v} não faz parte do plano`);return}
  const delta=target-cur;if(!delta){toast('Você já estava nessa página');return}
  rdAdjust(p,d,delta);save();rdDone(target?`Agora você está na pág. ${RD_SEQ[target-1]}`:'Leitura zerada')};

function vMais(){

}
function vCre(){
  const p=P(),c=p.plan.creatine,tt=creTotals(p),np=Object.keys(S.profiles).length,today=todayStr();
  const rows=[];let acc=0;for(let i=0;i<tt.days;i++){const d=addDays(c.start,i);const ds=creDoses(p,d);const g=ds.reduce((a,x)=>a+x.g,0);acc+=g;const dl=getDay(p,d);const taken=ds.filter((_,k)=>dl.cre[k]).length;
    rows.push(`<tr class="${d===today?'sel':''}"><td>${i+1}</td><td><button class="btn sm ghost" data-a="goday" data-d="${d}" data-t="hoje">${WD[dow(d)]} ${fmtD(d)}</button></td><td>${ds[0]?ds[0].phase:''}</td><td>${f0(g)} g</td><td class="wrap">${ds.map(x=>x.t).join(' · ')}</td><td>${taken}/${ds.length} ${taken===ds.length&&ds.length?'<span class="pos">✔</span>':''}</td><td>${f0(acc)} g</td></tr>`)}
  if(c.off)return `<div class="stack"><div class="card"><div class="ch"><h3>Creatina</h3><span class="pill">Desativada</span></div><p class="small muted" style="margin-bottom:10px">Este perfil não usa creatina. Se quiser começar, ative abaixo: 5 g por dia, começando hoje.</p><button class="btn pri" data-a="creon">Ativar creatina</button></div></div>`;
  return `<div class="stack"><div class="tiles"><div class="tile"><span class="upper">Saturação</span><span class="v">${f0(tt.satG)}<small> g</small></span><span class="small muted">${c.satDose} g/dia por ${tt.sat} dias (${c.satPerDay} × ${c.satDose/c.satPerDay} g)</span></div>
   <div class="tile"><span class="upper">Manutenção</span><span class="v">${f0(tt.manG)}<small> g</small></span><span class="small muted">${c.maintDose} g/dia por ${tt.man} dias</span></div>
   <div class="tile"><span class="upper">Total por pessoa</span><span class="v">${f0(tt.total)}<small> g</small></span></div>
   <div class="tile"><span class="upper">Potes de ${c.pot} g</span><span class="v">${Math.ceil(tt.total*np/c.pot)}</span><span class="small muted">para ${np} pessoa${np>1?'s':''} (${f0(tt.total*np)} g); um pote só não chega, compre com folga</span></div></div>
  <details class="acc"><summary>Parâmetros do protocolo</summary><div class="accb"><div class="fields">
   ${[['start','Início','date'],['end','Fim','date'],['satDose','Dose na saturação (g/dia)','number'],['satPerDay','Doses por dia na saturação','number'],['satDays','Dias de saturação','number'],['maintDose','Dose de manutenção (g/dia)','number'],['pot','Tamanho do pote (g)','number']].map(([k,l,ty])=>`<label class="f">${l}<input type="${ty}" value="${c[k]}" data-c="crep" data-k="${k}"></label>`).join('')}</div>
   <p class="small muted">Tome dissolvida, com uma refeição. Ela retém 1–2 kg de água: acompanhe pela cintura.</p></div></details>
  <div class="card"><div class="ch"><h3>Dia a dia</h3></div><div class="tbl-wrap" style="max-height:520px"><table class="tbl"><thead><tr><th>Dia</th><th>Data</th><th>Fase</th><th>Dose</th><th>Horários</th><th>Tomadas</th><th>Acumulado</th></tr></thead><tbody>${rows.join('')}</tbody></table></div></div></div>`;
}
A.creon=()=>{const c=P().plan.creatine;c.off=false;c.start=todayStr();c.satDays=0;if(c.end<c.start)c.end=addDays(c.start,49);save();render();toast('Creatina ativada: 5 g por dia')};
I.crep=el=>{const c=P().plan.creatine,k=el.dataset.k;if(el.type==='date'){if(el.value)c[k]=el.value}else{const v=num(el.value);if(v==null||v<=0)return;c[k]=k==='satPerDay'||k==='satDays'?Math.round(v):v}save();render()};

function vHist(){
  const p=P(),f=sub('hist','tudo');const L=[];
  p.sessions.filter(sessDone).forEach(s=>L.push({d:s.date,k:'treino',h:`<b>Treino ${s.wid} — ${esc((p.plan.workouts[s.wid]||{}).name||'')}</b><div class="small muted">${setsDone(s)} séries · ${f0(setsVol(s))} kg de volume${s.dur?' · '+s.dur+' min':''}${s.notes?'<br>“'+esc(s.notes)+'”':''}</div>`,go:'treino',del:'sess:'+s.id}));
  p.body.forEach(b=>L.push({d:b.date,k:'medida',h:`<b>Medidas</b><div class="small muted">${[b.weight!=null?f1(b.weight)+' kg':'',...MEAS.filter(m=>b[m[0]]!=null).map(m=>m[1]+' '+f1(b[m[0]])+' '+m[2])].filter(Boolean).join(' · ')}${b.note?'<br>“'+esc(b.note)+'”':''}</div>`,go:'corpo',del:'body:'+b.id}));
  Object.entries(p.days).forEach(([d,dl])=>{const t=dayTotals(p,d);if(t.logged||t.extraKcal||dl.troll)L.push({d,k:'dieta',h:`<b>Dieta e hábitos</b>${dl.troll?' <span class="pill bad" style="padding:1px 7px;font-size:10px">trolou</span>':''}<div class="small muted">${f0(t.kcal)} kcal de ${f0(dayTarget(p,d).kcal)} · P ${f0(t.p)} g · ${t.done}/${t.total} refeições</div>`,go:'dieta',del:'day:'+d});
    if(dl.giva&&!sessDone(sessionOf(p,d)))L.push({d,k:'treino',h:`<b>Givou o treino</b> <span class="pill bad" style="padding:1px 7px;font-size:10px">givei</span>`,go:'treino'});
    if(rdReadOn(p,d)>0||dl.rev)L.push({d,k:'leitura',h:`<b>Leitura</b><div class="small muted">${rdReadOn(p,d)>0?rdN(rdReadOn(p,d))+' lidas':''}${dl.rev?(rdReadOn(p,d)>0?' · ':'')+'revisão feita':''}</div>`,go:'leitura',del:'read:'+d});
    if(dl.note)L.push({d,k:'nota',h:`<b>Anotação</b><div class="small muted">${esc(dl.note)}</div>`,go:'hoje'})});
  const temNota=L.some(x=>x.k==='nota');
  const F=L.filter(x=>f==='tudo'||x.k===f).sort((a,b)=>b.d.localeCompare(a.d)||a.k.localeCompare(b.k));const lim=S.ui.histN||60;
  return `<div class="stack"><div class="seg">${[['tudo','Tudo'],['treino','Treinos'],['medida','Medidas'],['dieta','Dieta'],['leitura','Leitura'],...(temNota?[['nota','Anotações']]:[])].map(([k,l])=>`<button aria-pressed="${f===k}" data-a="histf" data-f="${k}">${l}</button>`).join('')}</div>
   ${F.length?F.slice(0,lim).map(x=>`<div class="card" style="padding:12px 14px"><div class="row" style="align-items:flex-start"><div style="min-width:74px"><div class="big" style="font-size:26px">${fmtD(x.d)}</div><div class="small faint">${WD[dow(x.d)]} · <span class="pill ${x.k==='treino'?'brand':x.k==='medida'?'lo':x.k==='dieta'?'hi':x.k==='leitura'?'ok':''}" style="padding:1px 7px;font-size:10px">${x.k}</span></div></div><div class="sp" style="min-width:0">${x.h}</div>
    <div class="row" style="gap:0;flex-wrap:nowrap"><button class="iconbtn" data-a="goday" data-d="${x.d}" data-t="${x.go}" aria-label="Abrir">${ico('right')}</button>${x.del?`<button class="iconbtn del" data-a="histdel" data-x="${x.del}" aria-label="Excluir">${ico('trash')}</button>`:''}</div></div></div>`).join(''):'<div class="empty">Nada registrado ainda. Seus treinos, medidas, refeições e anotações aparecem aqui.</div>'}
   ${F.length>lim?`<button class="btn" data-a="histmore">Mostrar mais</button>`:''}</div>`;
}
A.histf=el=>{S.ui.sub.hist=el.dataset.f;S.ui.histN=60;save();render()};A.histmore=()=>{S.ui.histN=(S.ui.histN||60)+60;render()};
A.histdel=el=>{const [k,id]=el.dataset.x.split(':');ask('Excluir este registro? Isso não pode ser desfeito.',()=>{const p=P();
  if(k==='sess')p.sessions=p.sessions.filter(s=>s.id!==id);else if(k==='body')p.body=p.body.filter(b=>b.id!==id);else if(k==='day'&&p.days[id]){const dl=p.days[id];dl.meals={};dl.extras=[];dl.water=0;dl.wlog=[];dl.troll=false;dl.giva=false}

/* calculadoras */

I.calc=()=>{
  const sex=$('#c_sex')?.value,age=num($('#c_age')?.value),w=num($('#c_w')?.value),h=num($('#c_h')?.value),f=num($('#c_f')?.value),k=num($('#c_k')?.value);
  const o1=$('#c_out1');if(o1){if([age,w,h,f].every(v=>v!=null)){const tmb=10*w+6.25*h-5*age+(sex==='F'?-161:5),td=tmb*f,def=k!=null?td-k:null,bmi=w/((h/100)**2);
    o1.innerHTML=`<div class="tile"><span class="upper">TMB</span><span class="v">${f0(tmb)}<small> kcal</small></span></div><div class="tile"><span class="upper">Gasto total</span><span class="v">${f0(td)}<small> kcal</small></span></div>${def!=null?`<div class="tile"><span class="upper">Déficit</span><span class="v">${f0(def)}<small> kcal/dia</small></span></div><div class="tile"><span class="upper">Perda estimada</span><span class="v">${f1(def*7/7700,2)}<small> kg/sem</small></span></div>`:''}<div class="tile"><span class="upper">IMC</span><span class="v">${f1(bmi)}</span></div>`}else o1.innerHTML='<span class="muted small">Preencha os campos.</span>'}
  const kg=num($('#r_k')?.value),r=num($('#r_r')?.value),o2=$('#c_out2');if(o2)o2.innerHTML=kg&&r?`<div class="tile"><span class="upper">1RM</span><span class="v">${f1(kg*(1+r/30))}<small> kg</small></span></div><div class="tile"><span class="upper">85% (≈ 6 reps)</span><span class="v">${f1(kg*(1+r/30)*.85)}<small> kg</small></span></div><div class="tile"><span class="upper">70% (≈ 12 reps)</span><span class="v">${f1(kg*(1+r/30)*.7)}<small> kg</small></span></div>`:'<span class="muted small">Informe carga e repetições.</span>';
  const np=num($('#n_p')?.value),nc=num($('#n_c')?.value),nq=num($('#n_q')?.value),o3=$('#c_out3');
  if(o3){let bf=null;if(np&&nc&&h){if(sex==='F'){if(nq&&nc+nq-np>0)bf=495/(1.29579-0.35004*Math.log10(nc+nq-np)+0.221*Math.log10(h))-450}else if(nc-np>0)bf=495/(1.0324-0.19077*Math.log10(nc-np)+0.15456*Math.log10(h))-450;
    o3.innerHTML=bf!=null&&isFinite(bf)?`<div class="tile"><span class="upper">Gordura</span><span class="v">${f1(bf)}<small> %</small></span></div>${w?`<div class="tile"><span class="upper">Massa magra</span><span class="v">${f1(w*(1-bf/100))}<small> kg</small></span></div>`:''}`:'<span class="muted small">Valores incompatíveis.</span>'}else o3.innerHTML='<span class="muted small">Informe pescoço e cintura'+(sex==='F'?' e quadril':'')+'.</span>'}
};

/* ajustes e backup */
function vAjustes(){
  const p=P(),np=Object.keys(S.profiles).length;
  const wopt=sel=>`<option value="R" ${sel==='R'?'selected':''}>Descanso</option>`+Object.entries(p.plan.workouts).map(([k,w])=>`<option value="${k}" ${sel===k?'selected':''}>${k} — ${esc(w.name)}</option>`).join('');
  return `<div class="stack"><div class="card"><div class="ch"><h3>Perfil de ${esc(p.name)}</h3></div><div class="fields">
   <label class="f">Nome<input type="text" value="${esc(p.name)}" data-c="pf" data-k="name"></label><label class="f">Idade<input type="number" value="${p.age}" data-c="pf" data-k="age"></label>
   <label class="f">Sexo<select data-c="pf" data-k="sex"><option value="M" ${p.sex!=='F'?'selected':''}>Masculino</option><option value="F" ${p.sex==='F'?'selected':''}>Feminino</option></select></label>
   <label class="f">Altura (m)<input type="number" step="0.01" value="${p.height}" data-c="pf" data-k="height"></label><label class="f">Peso inicial (kg)<input type="number" step="0.1" value="${p.startWeight==null?'':p.startWeight}" data-c="pf" data-k="startWeight"></label>
   <label class="f">Meta mínima de perda (kg)<input type="number" step="0.5" value="${p.goalMin}" data-c="pf" data-k="goalMin"></label><label class="f">Meta máxima (kg)<input type="number" step="0.5" value="${p.goalMax}" data-c="pf" data-k="goalMax"></label>
   <label class="f">Início do plano<input type="date" value="${p.start}" data-c="pf" data-k="start"></label><label class="f">Fim do plano<input type="date" value="${p.end}" data-c="pf" data-k="end"></label></div>
   ${np>1?`<div class="row" style="margin-top:12px"><button class="btn danger sm" data-a="delprof">Excluir ${esc(p.name)}</button></div>`:''}</div>
  <div class="card"><div class="ch"><h3>Rotina da semana</h3></div><p class="small muted" style="margin-bottom:10px">Dias de carbo alto (laranja) e treino de cada dia.</p>
   <div class="stack" style="gap:8px">${[1,2,3,4,5,6,0].map(i=>`<div class="row"><span style="width:44px;font-weight:700">${WD[i]}</span><button class="chip" aria-pressed="${p.plan.carbHigh.includes(i)}" data-a="hitoggle" data-i="${i}">Carbo ${p.plan.carbHigh.includes(i)?'alto':'baixo'}</button><select data-c="sched" data-i="${i}" style="flex:1;min-width:150px">${wopt(p.plan.sched[i]||'R')}</select></div>`).join('')}</div></div>
  ${typeof cloudCard==='function'?cloudCard():''}${typeof friendsCard==='function'?friendsCard():''}
  <div class="card"><div class="ch"><h3>Backup e dados</h3></div>
   <p class="small muted" style="margin-bottom:10px">${SYNC.state==='on'?'Seus dados também estão guardados na nuvem da sua conta, por pessoa e por mês.':'Seus dados ficam neste navegador. Se limpar os dados do site ou trocar de aparelho, eles somem: exporte um backup de vez em quando.'}${memOnly?' <b>O armazenamento local está bloqueado neste contexto: os dados valem só até fechar a página.</b>':''}</p>
   <div class="row"><button class="btn pri" data-a="exportjson">${ico('down')}Exportar backup (JSON)</button><button class="btn" data-a="importmodal">${ico('up')}Importar backup</button></div>
   <div class="row" style="margin-top:10px"><button class="btn sm" data-a="csv" data-k="body">CSV de medidas</button><button class="btn sm" data-a="csv" data-k="diet">CSV de dieta</button><button class="btn sm" data-a="csv" data-k="train">CSV de treinos</button></div>
   <hr class="sep"><div class="row"><button class="btn danger sm" data-a="clearlogs">Apagar registros de ${esc(p.name)}</button><button class="btn danger sm" data-a="resetall">Restaurar tudo ao original</button></div></div></div>`;
}
I.pf=el=>{const p=P(),k=el.dataset.k;if(['age','height','startWeight','goalMin','goalMax'].includes(k)){const v=num(el.value);if(v==null||v<=0){toast('Valor inválido');render();return}p[k]=k==='age'?Math.round(v):v}
  else if(k==='start'||k==='end'){if(!el.value)return;p[k]=el.value;if(p.end<p.start){toast('O fim deve ser depois do início');p[k]=k==='start'?p.end:p.start}}
  else p[k]=el.value.trim()||p[k];save();render();if(k==='name'&&typeof publishMe==='function')publishMe()};
A.hitoggle=el=>{const p=P(),i=+el.dataset.i,L=p.plan.carbHigh;p.plan.carbHigh=L.includes(i)?L.filter(x=>x!==i):L.concat(i).sort();save();render()};
I.sched=el=>{P().plan.sched[+el.dataset.i]=el.value;save()};
A.delprof=()=>ask(`Excluir ${P().name} e todos os registros? Isso não pode ser desfeito.`,()=>{delete photos[P().id];savePhotos();delete S.profiles[S.active];S.active=Object.keys(S.profiles)[0];save();render()},'Excluir');
A.clearlogs=()=>ask('Apagar todos os registros de dieta, treinos e medidas desta pessoa? O plano é mantido.',()=>{const p=P();p.days={};p.sessions=[];p.body=p.startWeight!=null?[{id:uid(),date:p.start,weight:p.startWeight,note:'Peso inicial'}]:[];save();render();toast('Registros apagados')},'Apagar');
A.resetall=()=>ask('Restaurar o app ao estado original? Todos os registros e edições de todas as pessoas serão apagados.',()=>{const ui=S.ui;S=freshState();S.onboarded=true;S.ui=ui;photos={};savePhotos();save();render();toast('Restaurado')},'Restaurar tudo');

async function exportFile(name,text,mime){
  if(!window.claude){try{const bl=new Blob([text],{type:mime||'text/plain;charset=utf-8'});const u=URL.createObjectURL(bl);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Download iniciado: '+name);return}catch(e){}}
  try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:text});toast('Arquivo salvo');return}}catch(e){if(e&&e.code==='declined')return}
  openModal(`<h3>${esc(name)}</h3><p class="small muted">O download direto não está disponível aqui. Copie o texto abaixo e cole num arquivo ${esc(name)}.</p><textarea id="expt" rows="10" readonly style="font-family:ui-monospace,monospace;font-size:12px">${esc(text)}</textarea><div class="mfoot"><button class="btn" data-a="close">Fechar</button><button class="btn pri" data-a="copyexp">${ico('copy')}Copiar</button></div>`,true);
}
A.copyexp=async()=>{const t=$('#expt');t.select();try{await navigator.clipboard.writeText(t.value);toast('Copiado')}catch(e){try{document.execCommand('copy');toast('Copiado')}catch(_){toast('Selecione o texto e copie')}}};
A.exportjson=()=>exportFile(`diario-fit-backup-${todayStr()}.json`,JSON.stringify({app:'diario-fit',exportedAt:new Date().toISOString(),state:S},null,1));
A.importmodal=()=>openModal(`<h3>Importar backup</h3><p class="small muted">Substitui todos os dados atuais pelos do arquivo.</p><label class="f">Arquivo .json<input type="file" accept=".json,application/json" id="imp_f" data-c="impfile"></label><label class="f">ou cole o conteúdo<textarea id="imp_t" rows="5"></textarea></label><div class="mfoot"><button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="impok">Importar</button></div>`);
I.impfile=el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#imp_t').value=r.result};r.readAsText(f)};
A.impok=()=>{try{const o=JSON.parse($('#imp_t').value);const st=o.state||o;if(!st.profiles||!Object.keys(st.profiles).length)throw 0;
  const ui=S.ui;S=st;S.ui=S.ui||ui;S.foods=S.foods||[];if(!S.profiles[S.active])S.active=Object.keys(S.profiles)[0];S.onboarded=true;save();SYNC.last={};closeModal();render();toast('Backup importado')}catch(e){toast('Arquivo inválido: não parece um backup do TRINCADA')}};
A.csv=el=>{const p=P(),k=el.dataset.k,q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';let rows=[];
  if(k==='body'){rows.push(['data','peso_kg',...MEAS.map(m=>m[1]),'obs']);bodySorted(p).forEach(b=>rows.push([b.date,b.weight,...MEAS.map(m=>b[m[0]]),b.note]))}
  else if(k==='diet'){rows.push(['data','tipo','kcal','meta_kcal','proteina_g','carbo_g','gordura_g','refeicoes','trolou']);Object.keys(p.days).sort().forEach(d=>{const t=dayTotals(p,d);if(!t.logged&&!t.extraKcal&&!trolled(p,d))return;rows.push([d,isHigh(p,d)?'alto':'baixo',Math.round(t.kcal),dayTarget(p,d).kcal,Math.round(t.p),Math.round(t.c),Math.round(t.f),t.done,trolled(p,d)?'sim':''])})}
  else{rows.push(['data','treino','exercicio','serie','kg','reps_ou_s','feita']);p.sessions.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>s.exercises.forEach(e=>e.sets.forEach((x,i)=>rows.push([s.date,s.wid,e.name,i+1,x.kg,x.reps,x.done?'sim':'não']))))}
  if(rows.length<2){toast('Ainda não há dados para exportar');return}
  exportFile(`diario-fit-${k}-${todayStr()}.csv`,'﻿'+rows.map(r=>r.map(q).join(';')).join('\n'))};

if(S.ui.tab==='cal')S.ui.tab='leitura';if(S.ui.psec==='cal')S.ui.psec='leitura';
{const h=(location.hash||'').slice(1);if(TABKEYS.includes(h))S.ui.tab=h;try{history.replaceState({t:S.ui.tab},'','#'+S.ui.tab)}catch(e){}}
document.body.insertAdjacentHTML('beforeend','<div id="toast" aria-live="polite"></div>');
